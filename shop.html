<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>DeinBasar – Shop</title><style>:root{--accent:#f26f21;--bg:#f6f6f8;--card:#fff;--text:#1d1d1f;--muted:#77777e;--line:#e5e5e9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}a{color:inherit}.wrap{width:min(1160px,calc(100% - 24px));margin:auto}header{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}nav{height:64px;display:flex;align-items:center;gap:10px}.brand{font-size:22px;font-weight:950;text-decoration:none}.brand span{color:#f26f21}.back{margin-left:auto;text-decoration:none;color:var(--muted);font-weight:800}.shop.light{--bg:#f6f6f8;--card:#fff;--text:#1d1d1f;--muted:#77777e;--line:#e5e5e9}.shop.dark{--bg:#151517;--card:#202024;--text:#fff;--muted:#b6b6bd;--line:#33343a}.shop.warm{--bg:#fff7ef;--card:#fffdf9;--text:#2a211c;--muted:#806f64;--line:#eadfd6}.shop{background:var(--bg);min-height:calc(100vh - 64px);color:var(--text)}.head{padding:28px 0 14px;display:flex;align-items:center;gap:14px}.logo{width:68px;height:68px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:950;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}.head h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-1.7px}.meta{color:var(--muted);font-size:13px;margin-top:4px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--card);border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850}.hero{margin-top:10px;border-radius:30px;padding:58px 5.5%;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--card)),var(--card));border:1px solid var(--line);overflow:hidden;position:relative}.dark .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,#151517),#202024)}.hero:after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:var(--accent);opacity:.08;right:-70px;top:-90px}.hero small{font-weight:900;letter-spacing:1.2px;color:var(--accent)}.hero h2{font-size:clamp(42px,8vw,78px);line-height:.94;letter-spacing:-3px;margin:12px 0 14px;max-width:820px}.hero p{max-width:700px;color:var(--muted);font-size:16px;line-height:1.6}.accentLine{width:92px;height:6px;background:var(--accent);border-radius:99px;margin-top:23px}.tabs{display:flex;gap:20px;overflow:auto;padding:22px 2px 4px}.tabs a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:850;white-space:nowrap}.section{padding:30px 0}.section h2{font-size:29px;margin:0 0 5px}.sub{margin:0 0 16px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.product{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;transition:.15s}.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px #00000010}.pic{aspect-ratio:1;background:#eceef1;display:grid;place-items:center;font-size:40px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.ptitle{font-weight:850}.price{font-size:19px;font-weight:950;margin-top:7px}.muted{color:var(--muted);font-size:12px;margin-top:5px}.detail{margin-top:10px;color:var(--accent);font-size:11px;font-weight:900}.info{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding-bottom:50px}.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}.box h3{font-size:23px;margin:0 0 8px}.box p{color:var(--muted);line-height:1.6}.services{display:grid;gap:9px;margin-top:14px}.service{background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:14px;padding:13px;font-size:12px;font-weight:850}.notice{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}.hero{padding:44px 22px}.hero h2{font-size:48px}}@media(max-width:420px){.grid{gap:8px}.body{padding:11px}.hero{border-radius:24px}.head{padding-top:22px}}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a class="back" href="basar.html">← Basar</a></nav></header><main id="shop" class="shop light"><div class="wrap"><section class="head"><div id="logo" class="logo">D</div><div><h1 id="name">DeinBasar Shop</h1><div id="meta" class="meta"></div><div id="chips" class="chips"></div></div></section><div id="notice"></div><section class="hero"><small>SHOP AUF DEINBASAR</small><h2 id="heroTitle">Einfach entdecken.</h2><p id="heroText"></p><div class="accentLine"></div></section><nav class="tabs"><a href="#sortiment">Artikel</a><a href="#shopinfo">Über den Shop</a><a href="#service">Service</a></nav><section id="sortiment" class="section"><h2>Artikel</h2><p id="count" class="sub">Wird geladen …</p><div id="products" class="grid"></div></section><section id="shopinfo" class="info"><div class="box"><h3 id="storyTitle">Über den Shop</h3><p id="description"></p></div><div id="service" class="box"><h3>Service</h3><div class="services"><div id="pickup" class="service">Abholung nach Absprache</div><div id="shipping" class="service">Versand nach Absprache</div><div id="rating" class="service">Noch keine Bewertungen</div></div></div></section></div></main><script src="app-core.js"></script><script>const $=id=>document.getElementById(id);function safeHex(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v:'#f26f21'}async function pub(path){const r=await fetch(DB.url+path,{headers:{apikey:DB.key}});const j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.message||'Laden fehlgeschlagen');return j}function card(p){return `<a class="product" href="anzeige.html?id=${encodeURIComponent(p.id)}"><div class="pic">${p.image_urls?.[0]?`<img src="${DB.esc(p.image_urls[0])}" alt="${DB.esc(p.title)}">`:'✦'}</div><div class="body"><div class="ptitle">${DB.esc(p.title)}</div><div class="price">${DB.euro(p.price)}</div><div class="muted">${DB.esc(p.location||'')}</div><div class="detail">Artikel ansehen →</div></div></a>`}function render(s,products,demo=false){const theme=['light','dark','warm'].includes(s.theme_style)?s.theme_style:'light',accent=safeHex(s.accent_color);$('shop').className='shop '+theme;$('shop').style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent',accent);$('name').textContent=s.name||'DeinBasar Shop';$('meta').textContent=[s.postal_code,s.city].filter(Boolean).join(' ')||'Auf DeinBasar';$('logo').innerHTML=s.logo_url?`<img src="${DB.esc(s.logo_url)}" alt="${DB.esc(s.name||'Shop')} Logo">`:DB.esc((s.name||'D')[0].toUpperCase());$('chips').innerHTML=(s.categories||[]).map(c=>`<span class="chip">${DB.esc(c)}</span>`).join('')+(s.verified?'<span class="chip">✓ Verifiziert</span>':'');$('heroTitle').textContent=(s.name||'Dieser Shop')+'. Einfach entdecken.';$('heroText').textContent=s.description||'Entdecke die aktuellen Artikel dieses Shops auf einen Blick.';$('storyTitle').textContent='Über '+(s.name||'diesen Shop');$('description').textContent=s.description||'Dieser Shop baut seinen Auftritt auf DeinBasar gerade weiter aus.';$('pickup').textContent=s.offers_pickup?'✓ Abholung möglich':'Abholung nach Absprache';$('shipping').textContent=s.offers_shipping?'✓ Versand möglich':'Versand nach Absprache';$('rating').textContent=s.rating_count?`★ ${Number(s.rating||0).toFixed(1)} · ${s.rating_count} Bewertungen`:'Noch keine Bewertungen';$('count').textContent=products.length+(products.length===1?' Artikel':' Artikel');$('products').innerHTML=products.length?products.map(card).join(''):'<div class="notice" style="grid-column:1/-1">Dieser Shop hat aktuell noch keine veröffentlichten Artikel.</div>';if(demo)$('notice').innerHTML='<div class="notice" style="margin-top:10px">Demo-Ansicht: Noch kein veröffentlichter Stand gefunden. Deshalb wird ein Beispiel-Shop gezeigt.</div>'}async function load(){try{const id=new URLSearchParams(location.search).get('id');let path='/rest/v1/shops?status=eq.active&select=id,name,description,city,postal_code,categories,logo_url,accent_color,theme_style,verified,rating,rating_count,offers_shipping,offers_pickup&order=created_at.desc&limit=1';if(id)path='/rest/v1/shops?id=eq.'+encodeURIComponent(id)+'&status=eq.active&select=id,name,description,city,postal_code,categories,logo_url,accent_color,theme_style,verified,rating,rating_count,offers_shipping,offers_pickup&limit=1';const shops=await pub(path);if(shops?.length){const s=shops[0];const products=await pub('/rest/v1/listings?shop_id=eq.'+encodeURIComponent(s.id)+'&status=eq.active&select=id,title,price,location,image_urls&order=created_at.desc');render(s,products,false);return}}catch(e){}const demo={name:'Beispiel Store',city:'Köln',postal_code:'50667',categories:['Mode'],accent_color:'#f26f21',theme_style:'light',verified:false,rating_count:0,offers_pickup:true,offers_shipping:false,description:'So sieht ein einfacher Händler-Shop auf DeinBasar aus: Logo, Farbe, Beschreibung und Artikel – ohne komplizierte visuelle Shop-Gestaltung.'};render(demo,[{id:'demo',title:'Beispiel Artikel',price:49,location:'Köln',image_urls:[]}],true);const a=$('products').querySelector('a');if(a)a.removeAttribute('href')}load();</script></body></html>
