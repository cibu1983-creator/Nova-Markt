<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>DeinBasar – Shop</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f}button,input{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;z-index:30;background:#ffffffd9;backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid #e5e5e7}.nav{height:62px;display:flex;align-items:center;gap:18px}.brand{font-weight:900;letter-spacing:-.6px;font-size:21px;text-decoration:none;color:#1d1d1f}.brand span{color:#f26f21}.back{margin-left:auto;color:#6e6e73;text-decoration:none;font-size:14px;font-weight:700}.shopHead{padding:34px 0 20px}.identity{display:flex;align-items:center;gap:16px}.logo{width:70px;height:70px;border-radius:22px;background:#111;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.identity h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-1.8px}.meta{color:#86868b;margin-top:5px;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#fff;border:1px solid #e4e4e7;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.hero{position:relative;min-height:470px;border-radius:34px;overflow:hidden;background:linear-gradient(145deg,#121827,#252f44 48%,#111827);box-shadow:0 22px 60px #00000018;color:#fff}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 30%,#6ea8ff45,transparent 33%),radial-gradient(circle at 20% 20%,#ff9d5c28,transparent 28%)}.scene{position:absolute;inset:0;perspective:1000px}.wall{position:absolute;left:7%;right:7%;top:12%;height:55%;border-radius:24px;background:linear-gradient(180deg,#27334a,#111827);box-shadow:inset 0 0 80px #0008}.floor{position:absolute;left:-7%;right:-7%;bottom:-22%;height:62%;background:linear-gradient(#25334c,#0b101b);transform:rotateX(63deg);transform-origin:bottom}.floor:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff0d 1px,transparent 1px),linear-gradient(#ffffff0d 1px,transparent 1px);background-size:80px 80px}.showTitle{position:absolute;left:7%;top:12%;z-index:3;max-width:480px}.showTitle small{display:block;color:#b9c9df;font-weight:800;letter-spacing:1.5px;margin-bottom:12px}.showTitle h2{font-size:clamp(38px,6vw,72px);line-height:.95;letter-spacing:-3px;margin:0}.showTitle p{font-size:17px;color:#d0d7e2;max-width:430px;line-height:1.45}.display{position:absolute;right:7%;bottom:10%;width:min(42%,430px);height:62%;z-index:4}.pedestal{position:absolute;bottom:2%;left:16%;right:6%;height:32%;border-radius:18px;background:linear-gradient(145deg,#f6f8fb,#9ba8bb);box-shadow:0 30px 45px #0009}.productOrb{position:absolute;left:36%;top:12%;width:43%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#bccbe0 38%,#475773 70%);box-shadow:0 0 55px #70aaff77}.hotspot{position:absolute;right:2%;top:28%;background:#ffffffea;color:#111;border:0;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900;box-shadow:0 10px 30px #0004}.tabs{display:flex;gap:22px;overflow:auto;padding:23px 2px 6px;position:sticky;top:62px;z-index:20;background:#f5f5f7e8;backdrop-filter:blur(14px)}.tabs a{text-decoration:none;color:#86868b;font-weight:800;font-size:14px;white-space:nowrap}.tabs a:first-child{color:#1d1d1f}.section{padding:36px 0}.sectionTop{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:17px}.section h2{font-size:30px;margin:0;letter-spacing:-1px}.section p.sub{color:#86868b;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 1px 0 #00000008;transition:.2s transform}.product:hover{transform:translateY(-3px)}.pic{aspect-ratio:1;background:#ececf0;display:grid;place-items:center;overflow:hidden;font-size:42px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.title{font-weight:800;line-height:1.25}.price{font-size:19px;font-weight:900;margin-top:8px}.muted{color:#86868b;font-size:12px;margin-top:5px}.story{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.storyCard{background:#fff;border-radius:28px;padding:28px}.storyCard.dark{background:#16181d;color:#fff}.storyCard h3{font-size:27px;margin:0 0 10px}.storyCard p{color:#86868b;line-height:1.6;margin:0}.storyCard.dark p{color:#b7b7bd}.service{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.service div{background:#f5f5f7;border-radius:18px;padding:16px;font-size:13px;font-weight:800}.storyCard.dark .service div{background:#24272d}.empty{background:#fff;border-radius:24px;padding:30px;color:#86868b}.loader{padding:70px 0;text-align:center;color:#86868b}.floating{position:fixed;right:18px;bottom:18px;z-index:25;border:0;background:#111;color:#fff;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:0 12px 30px #0003}.floating span{color:#ffd36a}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.story{grid-template-columns:1fr}.hero{min-height:540px}.showTitle{right:7%}.display{width:72%;height:45%;right:2%;bottom:4%;opacity:.9}.service{grid-template-columns:1fr}.tabs{top:60px}}@media(max-width:520px){.wrap{width:min(100% - 20px,1180px)}.shopHead{padding-top:24px}.logo{width:56px;height:56px;border-radius:17px}.hero{min-height:500px;border-radius:26px}.showTitle{top:9%}.showTitle h2{letter-spacing:-2px}.showTitle p{font-size:15px;max-width:330px}.display{width:86%;height:42%;right:-6%}.grid{grid-template-columns:1fr 1fr;gap:9px}.body{padding:12px}.section{padding:27px 0}.storyCard{padding:21px}.floating{right:12px;bottom:12px;padding:12px 15px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="basar.html">Dein<span>Basar</span></a><a class="back" href="basar.html">← Zurück zum Basar</a></div></header><main class="wrap"><div id="loading" class="loader">Shop wird geladen …</div><div id="shop" hidden><section class="shopHead"><div class="identity"><div id="logo" class="logo"></div><div><h1 id="name"></h1><div id="meta" class="meta"></div><div id="chips" class="chips"></div></div></div></section><section class="hero"><div class="scene"><div class="wall"></div><div class="floor"></div></div><div class="showTitle"><small>DIGITALER SHOP AUF DEINBASAR</small><h2 id="heroTitle">Mehr als nur Produkte.</h2><p id="heroText"></p></div><div class="display"><div class="productOrb"></div><div class="pedestal"></div><button class="hotspot" onclick="document.getElementById('sortiment').scrollIntoView()">Produkte ansehen →</button></div></section><nav class="tabs"><a href="#sortiment">Sortiment</a><a href="#shopinfo">Über den Shop</a><a href="#service">Service</a></nav><section class="section" id="sortiment"><div class="sectionTop"><div><h2>Sortiment</h2><p class="sub">Direkt aus diesem Shop.</p></div><span id="count" class="muted"></span></div><div id="products" class="grid"></div></section><section class="section" id="shopinfo"><div class="story"><div class="storyCard dark"><h3 id="storyTitle">Willkommen.</h3><p id="description"></p></div><div class="storyCard" id="service"><h3>Shop & Service</h3><p>So kannst du bei diesem Anbieter einkaufen.</p><div class="service"><div id="pickup">Abholung prüfen</div><div id="shipping">Versand prüfen</div><div id="rating">Noch keine Bewertung</div></div></div></div></section></div></main><button class="floating" onclick="location.href='basar.html'">✦ <span>Basar AI</span></button><script>const SB='https://pnyoozmgiwftnyuefsgr.supabase.co',KEY='sb_publishable_LeZfLoRAvtqTMuLHaqjxbA_1rasUioY';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);async function get(path){const r=await fetch(SB+path,{headers:{apikey:KEY}});const j=await r.json();if(!r.ok)throw Error(j?.message||'Fehler');return j}function productCard(p){return `<article class="product"><div class="pic">${p.image_urls?.[0]?`<img src="${esc(p.image_urls[0])}" alt="">`:'✦'}</div><div class="body"><div class="title">${esc(p.title)}</div><div class="price">${euro(p.price)}</div><div class="muted">${esc(p.location||'')}</div></div></article>`}function render(s,products){$('name').textContent=s.name||'DeinBasar Shop';$('meta').textContent=[s.postal_code,s.city].filter(Boolean).join(' ')||'Auf DeinBasar';$('heroTitle').textContent=s.name?`${s.name}. Digital neu gedacht.`:'Mehr als nur Produkte.';$('heroText').textContent=s.description||'Entdecke Produkte in einem Shop, der mehr zeigt als eine klassische Anzeigenliste.';$('storyTitle').textContent=s.name?`Das ist ${s.name}.`:'Willkommen.';$('description').textContent=s.description||'Dieser Shop baut seinen digitalen Auftritt auf DeinBasar gerade weiter aus.';$('logo').innerHTML=s.logo_url?`<img src="${esc(s.logo_url)}" alt="">`:esc((s.name||'D').slice(0,1).toUpperCase());$('chips').innerHTML=(s.categories||[]).slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')+(s.verified?'<span class="chip">✓ Verifiziert</span>':'');$('pickup').textContent=s.offers_pickup?'✓ Abholung möglich':'Abholung nach Absprache';$('shipping').textContent=s.offers_shipping?'✓ Versand möglich':'Versand nicht angegeben';$('rating').textContent=Number(s.rating_count||0)>0?`★ ${Number(s.rating||0).toFixed(1)} · ${s.rating_count}`:'Noch keine Bewertungen';$('count').textContent=`${products.length} Produkte`;$('products').innerHTML=products.length?products.map(productCard).join(''):'<div class="empty">Dieser Shop hat noch keine aktiven Produkte eingestellt.</div>';$('loading').hidden=true;$('shop').hidden=false}async function load(){try{const id=new URLSearchParams(location.search).get('id');let shops;if(id){shops=await get('/rest/v1/shops?id=eq.'+encodeURIComponent(id)+'&status=eq.active&select=id,name,description,city,postal_code,categories,logo_url,verified,rating,rating_count,offers_shipping,offers_pickup')}else{shops=await get('/rest/v1/shops?status=eq.active&select=id,name,description,city,postal_code,categories,logo_url,verified,rating,rating_count,offers_shipping,offers_pickup&order=created_at.desc&limit=1')}if(!shops.length)throw Error('Shop nicht gefunden');const s=shops[0];const products=await get('/rest/v1/listings?shop_id=eq.'+encodeURIComponent(s.id)+'&status=eq.active&select=id,title,price,location,image_urls&order=created_at.desc');render(s,products)}catch(e){$('loading').innerHTML='Dieser Shop konnte gerade nicht geladen werden.<br><a href="basar.html" style="color:#111;font-weight:800">Zurück zum Basar</a>'}}load();</script></body></html>
