<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Anzeige</title><style>:root{--o:#f26f21;--t:#19191b;--m:#73737a;--l:#e5e5e9;--bg:#f6f6f8;--ok:#237746;--bad:#a1322d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,textarea{font:inherit}a{color:inherit}.wrap{width:min(1040px,calc(100% - 24px));margin:auto}header{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid var(--l)}nav{height:64px;display:flex;align-items:center;gap:9px}.brand{font-size:21px;font-weight:950;text-decoration:none}.brand span{color:var(--o)}.navlinks{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:12px 15px;background:#19191b;color:#fff;font-weight:850;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.orange{background:var(--o)}.btn.light{background:#fff;color:#19191b;border:1px solid var(--l)}.main{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;padding:24px 0 50px}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:18px}.gallery{background:#eee;border-radius:20px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#999}.gallery img{width:100%;height:100%;object-fit:contain;background:#f0f0f2}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:8px}.thumbs button{border:1px solid var(--l);padding:0;width:70px;height:58px;border-radius:10px;overflow:hidden;background:#eee}.thumbs img{width:100%;height:100%;object-fit:cover}.title{font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px;line-height:1.03;margin:17px 0 7px}.price{font-size:32px;font-weight:950}.meta{color:var(--m);font-size:12px;margin-top:6px}.desc{white-space:pre-wrap;line-height:1.6;margin-top:18px}.seller{display:flex;gap:11px;align-items:center}.avatar{width:52px;height:52px;border-radius:15px;background:#19191b;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:950}.field{margin-top:13px}.field textarea{width:100%;min-height:105px;border:1px solid #d9d9de;border-radius:12px;padding:12px;resize:vertical}.notice{margin-top:10px;padding:11px;border-radius:12px;background:#f1f1f3;color:var(--m);font-size:12px;line-height:1.5}.notice.ok{background:#edf8f1;color:var(--ok)}.notice.bad{background:#fff0ee;color:var(--bad)}.side{display:grid;gap:13px;align-content:start}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:760px){.main{grid-template-columns:1fr;padding-top:12px}.navlinks .hideMob{display:none}.card{padding:15px}}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><div class="navlinks"><a class="btn orange" href="verkaufen.html">＋ <span class="hideMob">Anzeige</span></a><a class="btn light" href="konto.html">Konto</a></div></nav></header><main class="wrap"><div id="error" class="card empty hidden" style="margin-top:24px"></div><section id="content" class="main hidden"><div><div id="hero" class="gallery">Kein Bild</div><div id="thumbs" class="thumbs"></div><h1 id="title" class="title"></h1><div id="price" class="price"></div><div id="meta" class="meta"></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0">Beschreibung</h2><div id="description" class="desc"></div></div></div><aside class="side"><div class="card"><div class="seller"><div id="avatar" class="avatar">D</div><div><b id="sellerName">Verkäufer</b><div id="sellerMeta" class="meta"></div></div></div></div><div id="contactCard" class="card"><h2 style="margin-top:0">Verkäufer kontaktieren</h2><div id="contactLoggedOut"><div class="muted">Zum Schreiben bitte kurz einloggen.</div><a class="btn orange" style="width:100%;margin-top:12px" href="konto.html">Einloggen / Registrieren</a></div><div id="contactForm" class="hidden"><div class="field"><textarea id="message" placeholder="Hallo, ist der Artikel noch verfügbar?"></textarea></div><button id="send" class="btn orange" style="width:100%;margin-top:9px">Nachricht senden</button><button id="buyAsk" class="btn light" style="width:100%;margin-top:8px">Kauf anfragen</button><div id="notice" class="notice">Keine Zahlung über DeinBasar – Details klärt ihr direkt miteinander.</div></div><div id="ownNotice" class="notice hidden">Das ist deine eigene Anzeige. Du kannst sie in „Mein Konto“ verwalten.</div></div></aside></section></main><script src="app-core.js"></script><script>
const $=id=>document.getElementById(id);let item=null,me=null,seller=null;const id=new URLSearchParams(location.search).get('id');async function pub(path){const r=await fetch(DB.url+path,{headers:{apikey:DB.key}});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.error||'Laden fehlgeschlagen');return j}function notice(t,c=''){$('notice').textContent=t;$('notice').className='notice'+(c?' '+c:'')}
async function init(){if(!id)return fail('Anzeige nicht gefunden.');try{const rows=await pub('/rest/v1/listings?id=eq.'+encodeURIComponent(id)+'&status=eq.active&select=id,seller_id,title,description,price,category,location,image_urls,created_at&limit=1');item=rows?.[0];if(!item)return fail('Diese Anzeige ist nicht mehr verfügbar.');try{seller=(await pub('/rest/v1/profiles?id=eq.'+item.seller_id+'&select=display_name,city,rating,rating_count&limit=1'))?.[0]}catch{}render();try{me=await DB.user()}catch{}renderContact()}catch(e){fail(e.message)}}function fail(t){$('error').textContent=t;$('error').classList.remove('hidden');$('content').classList.add('hidden')}
function render(){document.title=item.title+' – DeinBasar';$('content').classList.remove('hidden');$('title').textContent=item.title;$('price').textContent=DB.euro(item.price);$('meta').textContent=[item.category,item.location,DB.date(item.created_at)].filter(Boolean).join(' · ');$('description').textContent=item.description||'Keine Beschreibung.';const imgs=item.image_urls||[];if(imgs.length){$('hero').innerHTML=`<img id="heroImg" src="${DB.esc(imgs[0])}" alt="${DB.esc(item.title)}">`;$('thumbs').innerHTML=imgs.map((u,i)=>`<button data-u="${DB.esc(u)}"><img src="${DB.esc(u)}" alt="Bild ${i+1}"></button>`).join('');$('thumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>document.getElementById('heroImg').src=b.dataset.u)}const n=seller?.display_name||'DeinBasar Nutzer';$('sellerName').textContent=n;$('sellerMeta').textContent=seller?.city||'';$('avatar').textContent=(n[0]||'D').toUpperCase()}
function renderContact(){if(!me)return;if(me.id===item.seller_id){$('contactLoggedOut').classList.add('hidden');$('ownNotice').classList.remove('hidden');return}$('contactLoggedOut').classList.add('hidden');$('contactForm').classList.remove('hidden')}
async function getConversation(){let rows=await DB.authRequest('/rest/v1/conversations?listing_id=eq.'+item.id+'&buyer_id=eq.'+me.id+'&seller_id=eq.'+item.seller_id+'&select=id&limit=1');if(rows?.[0])return rows[0].id;try{rows=await DB.authRequest('/rest/v1/conversations',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({listing_id:item.id,buyer_id:me.id,seller_id:item.seller_id})});return rows?.[0]?.id}catch(e){rows=await DB.authRequest('/rest/v1/conversations?listing_id=eq.'+item.id+'&buyer_id=eq.'+me.id+'&seller_id=eq.'+item.seller_id+'&select=id&limit=1');if(rows?.[0])return rows[0].id;throw e}}
async function sendText(text){if(!me)return location.href='konto.html';const body=text.trim();if(!body)return notice('Bitte eine Nachricht eingeben.','bad');$('send').disabled=true;$('buyAsk').disabled=true;try{const cid=await getConversation();if(!cid)throw Error('Unterhaltung konnte nicht erstellt werden.');await DB.authRequest('/rest/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({conversation_id:cid,sender_id:me.id,body})});$('message').value='';notice('Nachricht gesendet. Du findest die Unterhaltung in deinem Konto.','ok')}catch(e){notice(e.message||'Senden fehlgeschlagen.','bad')}finally{$('send').disabled=false;$('buyAsk').disabled=false}}
$('send').onclick=()=>sendText($('message').value);$('buyAsk').onclick=()=>sendText('Hallo, ich interessiere mich für „'+item.title+'“. Ist der Artikel noch verfügbar?');init();
</script></body></html>
