<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfd"><title>DeinBasar – Anzeige</title><style>:root{--bg:#fbfbfd;--card:#fff;--text:#171719;--muted:#77777d;--line:#e7e7eb;--soft:#f3f3f6;--orange:#f26f21;--green:#2f9c59}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.wrap{width:min(1100px,calc(100% - 24px));margin:auto}a{color:inherit}header{position:sticky;top:0;z-index:30;background:#fbfbfddd;backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{height:62px;display:flex;align-items:center;gap:10px}.brand{text-decoration:none;font-size:22px;font-weight:900}.brand span{color:var(--orange)}.nav a:last-child{margin-left:auto;text-decoration:none;color:var(--muted);font-weight:800}.back{display:inline-block;margin:22px 0 14px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:800}.layout{display:grid;grid-template-columns:1.18fr .82fr;gap:18px;align-items:start;padding-bottom:90px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden}.galleryMain{aspect-ratio:4/3;background:#eceef2;display:grid;place-items:center;overflow:hidden}.galleryMain img{width:100%;height:100%;object-fit:contain;background:#111}.thumbs{display:flex;gap:8px;padding:10px;overflow:auto}.thumb{width:76px;height:60px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#eee;flex:0 0 auto;padding:0}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}.info{padding:22px}.kind{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850}.info h1{font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:-1.8px;margin:14px 0 10px}.price{font-size:36px;font-weight:950}.meta{color:var(--muted);font-size:13px;margin-top:8px}.section{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.section h2{font-size:20px;margin:0 0 10px}.desc{white-space:pre-wrap;line-height:1.55;font-size:15px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{background:var(--soft);border-radius:14px;padding:11px}.detail small{display:block;color:var(--muted);margin-bottom:4px}.seller{padding:20px}.sellerTop{display:flex;gap:12px;align-items:center}.avatar{width:54px;height:54px;border-radius:16px;background:#171719;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.sellerName{font-weight:900;font-size:18px}.sellerMeta{color:var(--muted);font-size:12px;margin-top:3px}.buyBox{margin-top:16px;border-radius:20px;padding:16px;background:#f6f6f8;border:1px solid var(--line)}.buyBox h3{margin:0 0 5px;font-size:20px}.buyBox p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.buyBtn{width:100%;margin-top:13px;border:0;border-radius:14px;padding:14px 15px;background:var(--green);color:#fff;font-weight:900;cursor:pointer}.contact{margin-top:12px;background:#171719;color:#fff;border-radius:20px;padding:16px}.contact textarea{width:100%;min-height:96px;border:0;border-radius:14px;padding:12px;resize:vertical}.btn{width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px 15px;background:var(--orange);color:#fff;font-weight:850;cursor:pointer}.btn.dark{background:#fff;color:#171719;border:1px solid var(--line)}.note{font-size:11px;color:#b9b9bf;line-height:1.45;margin-top:9px}.owner{background:#fff4ec;color:#b95b1e;border-radius:16px;padding:13px;margin-top:14px;font-size:13px}.empty{padding:50px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:999px;display:none;z-index:50}.mobileActions{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#ffffffef;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}.mobileActions button{flex:1;border:0;border-radius:14px;padding:14px 10px;font-weight:900;cursor:pointer}.mobileMsg{background:#171719;color:#fff}.mobileBuy{background:var(--green);color:#fff}.sellerJump{display:inline-flex;align-items:center;gap:7px;margin-top:14px;color:#171719;font-size:13px;font-weight:850;text-decoration:none}.sellerJump span{color:var(--orange)}@media(max-width:800px){.layout{grid-template-columns:1fr}.info{padding:18px}.seller{padding:18px}.details{grid-template-columns:1fr}.galleryMain{aspect-ratio:1/1}.mobileActions.show{display:flex}.layout{padding-bottom:115px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a href="konto.html">Mein Konto</a></div></header><main class="wrap"><a class="back" href="basar.html">← Zurück zu den Angeboten</a><div id="content" class="layout"><div class="card"><div class="empty">Anzeige wird geladen …</div></div></div></main><div id="mobileActions" class="mobileActions"><button id="mobileMsg" class="mobileMsg">Nachricht schreiben</button><button id="mobileBuy" class="mobileBuy">Kaufen anfragen</button></div><div id="toast" class="toast"></div><script>const SB='https://pnyoozmgiwftnyuefsgr.supabase.co',KEY='sb_publishable_LeZfLoRAvtqTMuLHaqjxbA_1rasUioY',token=localStorage.getItem('nova_token')||'';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);let listing,user=null,seller=null;function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}async function req(path,auth=false){const h={apikey:KEY};if(auth&&token)h.Authorization='Bearer '+token;const r=await fetch(SB+path,{headers:h});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.error||'Fehler');return j}function parseDetails(text){const lines=String(text||'').split('\n');const out=[];for(const line of lines){const m=line.match(/^([^:]{2,40}):\s*(.+)$/);if(m&&m[1]!=='Produktdetails')out.push([m[1].trim(),m[2].trim()])}return out.slice(0,12)}function mainDescription(text){return String(text||'').split(/\n\nProduktdetails\n/)[0].trim()}function scrollToContact(){const el=document.querySelector('.seller');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{const m=$('msg');if(m)m.focus()},450)}function render(){const imgs=Array.isArray(listing.image_urls)?listing.image_urls.filter(Boolean):[],details=parseDetails(listing.description),mine=user&&user.id===listing.seller_id;const created=listing.created_at?new Date(listing.created_at).toLocaleDateString('de-DE'):'',since=seller?.created_at?new Date(seller.created_at).toLocaleDateString('de-DE',{month:'long',year:'numeric'}):'';$('content').innerHTML=`<section class="card"><div class="galleryMain" id="mainPic">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(listing.title)}">`:'📦'}</div>${imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button class="thumb ${i===0?'active':''}" data-img="${esc(u)}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}<div class="info"><span class="kind">${listing.shop_id?'Shop-Angebot':'Privates Angebot'}</span><h1>${esc(listing.title)}</h1><div class="price">${euro(listing.price)}</div><div class="meta">📍 ${esc(listing.location||'Ort nicht angegeben')}${created?' · Eingestellt am '+created:''}</div>${!mine?'<a class="sellerJump" href="#sellerCard"><span>●</span> Verkäufer kontaktieren</a>':''}<div class="section"><h2>Beschreibung</h2><div class="desc">${esc(mainDescription(listing.description)||'Keine Beschreibung vorhanden.')}</div></div>${details.length?`<div class="section"><h2>Produktdetails</h2><div class="details">${details.map(d=>`<div class="detail"><small>${esc(d[0])}</small><b>${esc(d[1])}</b></div>`).join('')}</div></div>`:''}</div></section><aside class="card seller" id="sellerCard"><div class="sellerTop"><div class="avatar">${esc((seller?.display_name||'D')[0].toUpperCase())}</div><div><div class="sellerName">${esc(seller?.display_name||'DeinBasar Nutzer')}</div><div class="sellerMeta">${esc(seller?.city||listing.location||'')} ${since?'· Mitglied seit '+since:''}</div><div class="sellerMeta">⭐ ${Number(seller?.rating||0).toFixed(1)} (${Number(seller?.rating_count||0)} Bewertungen)${seller?.phone_verified?' · ✓ Telefon verifiziert':''}</div></div></div>${mine?`<div class="owner">Das ist deine eigene Anzeige. Verwalte Reservierung und Verkauf in „Mein Konto“.</div><a class="btn dark" href="konto.html" style="display:block;text-align:center;text-decoration:none">Zu meinem Konto</a>`:`<div class="buyBox"><h3>Artikel kaufen</h3><p>Mit „Kaufen anfragen“ sendest du dem Verkäufer eine Kaufabsicht zur Abstimmung. Eine Online-Zahlung ist in dieser Testphase noch nicht integriert.</p><button class="buyBtn" id="buyBtn">Kaufen anfragen · ${euro(listing.price)}</button></div><div class="contact"><b>Verkäufer direkt anschreiben</b><div class="note">Die Unterhaltung läuft über DeinBasar. E-Mail und Telefonnummer bleiben privat.</div><textarea id="msg" placeholder="Hallo, ist der Artikel noch verfügbar?"></textarea><button class="btn" id="sendBtn">Nachricht senden</button><div class="note" id="contactHint"></div></div>`}</aside>`;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('mainPic').innerHTML=`<img src="${esc(b.dataset.img)}" alt="${esc(listing.title)}">`});if(!mine){$('mobileActions').classList.add('show');$('mobileMsg').onclick=scrollToContact;$('mobileBuy').onclick=()=>startConversation('buy');if($('sendBtn'))$('sendBtn').onclick=()=>startConversation('message');if($('buyBtn'))$('buyBtn').onclick=()=>startConversation('buy')}else{$('mobileActions').classList.remove('show')}}async function ensureUser(){if(!token){location.href='konto.html';return false}if(!user){try{user=await req('/auth/v1/user',true)}catch{location.href='konto.html';return false}}return true}async function getConversation(){let conv=await req('/rest/v1/conversations?listing_id=eq.'+encodeURIComponent(listing.id)+'&buyer_id=eq.'+encodeURIComponent(user.id)+'&seller_id=eq.'+encodeURIComponent(listing.seller_id)+'&select=id&limit=1',true);let cid=conv[0]?.id;if(!cid){const r=await fetch(SB+'/rest/v1/conversations',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({listing_id:listing.id,buyer_id:user.id,seller_id:listing.seller_id})});const j=await r.json();if(!r.ok)throw Error(j?.message||'Kontakt konnte nicht gestartet werden.');cid=j[0]?.id}return cid}async function startConversation(mode){if(!await ensureUser())return;if(user.id===listing.seller_id)return toast('Das ist deine eigene Anzeige.');const btn=mode==='buy'?($('buyBtn')||$('mobileBuy')):$('sendBtn');const text=mode==='buy'?`Hallo, ich möchte den Artikel „${listing.title}“ für ${euro(listing.price)} kaufen. Ist er noch verfügbar?`:$('msg').value.trim();if(!text)return toast('Bitte eine Nachricht eingeben.');if(btn){btn.disabled=true;var old=btn.textContent;btn.textContent=mode==='buy'?'Kaufanfrage wird gesendet …':'Wird gesendet …'}try{const cid=await getConversation();const r=await fetch(SB+'/rest/v1/messages',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({conversation_id:cid,sender_id:user.id,body:text})});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j?.message||'Nachricht konnte nicht gesendet werden.')}if(mode==='buy'){toast('Kaufanfrage gesendet.');setTimeout(()=>location.href='konto.html#nachrichten',700)}else{toast('Nachricht gesendet.');$('msg').value='';$('contactHint').textContent='Deine Nachricht wurde an den Verkäufer gesendet.'}}catch(e){toast(e.message)}finally{if(btn){btn.disabled=false;btn.textContent=old}}}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('content').innerHTML='<div class="card empty">Keine Anzeige ausgewählt.</div>';return}try{if(token){try{user=await req('/auth/v1/user',true)}catch{}}const rows=await req('/rest/v1/listings?id=eq.'+encodeURIComponent(id)+'&status=eq.active&select=id,seller_id,title,description,price,category,location,image_urls,status,created_at,shop_id');listing=rows[0];if(!listing)throw Error('Anzeige nicht gefunden.');const ps=await req('/rest/v1/profiles?id=eq.'+encodeURIComponent(listing.seller_id)+'&select=display_name,city,created_at,phone_verified,rating,rating_count');seller=ps[0]||{};render()}catch(e){$('content').innerHTML='<div class="card empty">Diese Anzeige konnte nicht geladen werden.</div>'}}load();</script></body></html>
