<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Konto</title><style>:root{--o:#f26f21;--b:#171719;--m:#73737a;--l:#e5e5e8}*{box-sizing:border-box}body{margin:0;background:#f6f6f8;color:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{width:min(520px,calc(100% - 24px));margin:auto}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:62px;display:flex;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none;color:var(--b)}.brand span{color:var(--o)}.back{margin-left:auto;text-decoration:none;color:var(--m);font-weight:700}.hero{padding:38px 0 18px}.hero h1{font-size:42px;letter-spacing:-2px;margin:0 0 8px}.hero p{color:var(--m);margin:0}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:20px;margin-bottom:30px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f1f3;padding:4px;border-radius:13px;margin-bottom:20px}.tabs button{border:0;background:transparent;padding:11px;border-radius:10px;font-weight:800}.tabs .on{background:#fff;box-shadow:0 1px 4px #0001}.form{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;height:52px;border:1px solid #d8d8dd;border-radius:13px;padding:0 13px;background:#fff;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{height:52px;border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:900;cursor:pointer}.orange{background:var(--o)}.light{background:#fff;color:var(--b);border:1px solid var(--l)}.hidden{display:none!important}.msg{padding:12px;border-radius:12px;background:#f1f1f3;color:var(--m);font-size:13px;line-height:1.45}.msg.ok{background:#edf8f1;color:#216d3d}.msg.err{background:#fff0ee;color:#9b312b}.account{text-align:center}.avatar{width:68px;height:68px;border-radius:20px;background:#171719;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900;margin:0 auto 12px}.account h2{margin:0}.account p{color:var(--m)}.actions{display:grid;gap:9px;margin-top:20px}.actions a{text-decoration:none;display:grid;place-items:center}.small{margin-top:9px;width:100%}@media(max-width:520px){.row{grid-template-columns:1fr}.hero h1{font-size:36px}.card{padding:17px}}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a class="back" href="basar.html">Zum Basar</a></nav></header><main class="wrap"><section class="hero"><h1>Mein Konto</h1><p>Einloggen, registrieren und Anzeigen verwalten.</p></section><section id="auth" class="card"><div class="tabs"><button id="loginTab" class="on" type="button">Einloggen</button><button id="regTab" type="button">Registrieren</button></div><form id="form" class="form"><div id="regFields" class="hidden"><div class="row"><div class="field"><label>Vorname</label><input id="first" autocomplete="given-name"></div><div class="field"><label>Nachname</label><input id="last" autocomplete="family-name"></div></div><div class="row"><div class="field"><label>PLZ</label><input id="postal" inputmode="numeric" autocomplete="postal-code"></div><div class="field"><label>Ort</label><input id="city" autocomplete="address-level2"></div></div></div><div class="field"><label>E-Mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Passwort</label><input id="pass" type="password" minlength="8" required autocomplete="current-password"></div><button id="submit" class="btn" type="submit">Einloggen</button><div id="msg" class="msg">Noch kein Konto? Oben auf „Registrieren“ tippen.</div></form><button id="reset" class="btn light small" type="button">Passwort vergessen?</button></section><section id="account" class="card account hidden"><div id="avatar" class="avatar">D</div><h2 id="name">Willkommen</h2><p id="mail"></p><div class="actions"><a class="btn orange" href="verkaufen.html">＋ Anzeige aufgeben</a><a class="btn light" href="basar.html">Angebote ansehen</a></div><button id="logout" class="btn light small">Ausloggen</button></section></main><script>const SB='https://pnyoozmgiwftnyuefsgr.supabase.co',KEY='sb_publishable_LeZfLoRAvtqTMuLHaqjxbA_1rasUioY',CONFIRM='https://cibu1983-creator.github.io/Nova-Markt/auth-confirm.html';let mode='login';const $=x=>document.getElementById(x);function message(t,c=''){$('msg').textContent=t;$('msg').className='msg '+c}function setMode(m){mode=m;$('loginTab').classList.toggle('on',m==='login');$('regTab').classList.toggle('on',m==='register');$('regFields').classList.toggle('hidden',m==='login');$('submit').textContent=m==='login'?'Einloggen':'Konto erstellen';$('pass').autocomplete=m==='login'?'current-password':'new-password';message(m==='login'?'Mit E-Mail und Passwort einloggen.':'Kostenloses Konto erstellen. Passwort mindestens 8 Zeichen.')}$('loginTab').onclick=()=>setMode('login');$('regTab').onclick=()=>setMode('register');async function request(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error_description||j.msg||j.message||j.error||'Verbindung fehlgeschlagen.');return j}function saveSession(j){if(j.access_token)localStorage.setItem('nova_token',j.access_token);if(j.refresh_token)localStorage.setItem('nova_refresh_token',j.refresh_token)}async function showAccount(){const token=localStorage.getItem('nova_token');if(!token)return;try{const u=await request(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});$('auth').classList.add('hidden');$('account').classList.remove('hidden');const md=u.user_metadata||{},n=md.display_name||[md.first_name,md.last_name].filter(Boolean).join(' ')||'DeinBasar Nutzer';$('name').textContent=n;$('mail').textContent=u.email||'';$('avatar').textContent=n[0].toUpperCase()}catch{localStorage.removeItem('nova_token');localStorage.removeItem('nova_refresh_token')}}$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;message(mode==='login'?'Anmeldung läuft …':'Konto wird erstellt …');try{if(mode==='login'){const j=await request(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})});saveSession(j);await showAccount()}else{if(!$('first').value.trim()||!$('last').value.trim())throw Error('Bitte Vorname und Nachname eingeben.');const meta={first_name:$('first').value.trim(),last_name:$('last').value.trim(),display_name:$('first').value.trim()+' '+$('last').value.trim(),postal_code:$('postal').value.trim(),city:$('city').value.trim()};const j=await request(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value,data:meta,options:{emailRedirectTo:CONFIRM}})});if(j.access_token){saveSession(j);await showAccount()}else message('Konto erstellt. Bitte bestätige jetzt die E-Mail und logge dich danach ein.','ok')}}catch(e){let t=e.message;if(/invalid login credentials/i.test(t))t='E-Mail oder Passwort ist falsch.';if(/email not confirmed/i.test(t))t='Bitte bestätige zuerst deine E-Mail.';if(/rate|security purposes|seconds/i.test(t))t='Zu viele Versuche. Bitte kurz warten und erneut probieren.';message(t,'err')}finally{b.disabled=false;b.textContent=mode==='login'?'Einloggen':'Konto erstellen'}};$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email)return message('Bitte zuerst deine E-Mail eingeben.','err');try{await request(SB+'/auth/v1/recover?redirect_to='+encodeURIComponent(CONFIRM),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});message('E-Mail zum Zurücksetzen wurde angefordert. Bitte Postfach prüfen.','ok')}catch(e){message(e.message,'err')}};$('logout').onclick=()=>{localStorage.removeItem('nova_token');localStorage.removeItem('nova_refresh_token');location.reload()};showAccount();</script></body></html>
