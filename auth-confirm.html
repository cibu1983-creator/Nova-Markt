<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeinBasar – Bestätigung</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f6f8;color:#19191b;display:grid;min-height:100vh;place-items:center}.card{width:min(480px,calc(100% - 28px));background:#fff;border:1px solid #e6e6ea;border-radius:24px;padding:24px;text-align:center}.logo{font-size:22px;font-weight:950}.logo span{color:#f26f21}h1{font-size:30px;letter-spacing:-1px}.muted{color:#73737a;line-height:1.5}.btn{display:inline-block;margin-top:14px;background:#19191b;color:#fff;text-decoration:none;border-radius:13px;padding:12px 16px;font-weight:850}</style></head><body><div class="card"><div class="logo">dein<span>basar</span>.de</div><h1 id="title">Bestätigung läuft …</h1><div id="text" class="muted">Einen Moment bitte.</div><a id="link" class="btn" href="konto.html" style="display:none">Zum Konto</a></div><script src="app-core.js"></script><script>
const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));const get=k=>h.get(k)||q.get(k);const err=get('error_description')||get('error');const access=get('access_token'),refresh=get('refresh_token'),type=get('type');const title=document.getElementById('title'),text=document.getElementById('text'),link=document.getElementById('link');
if(err){title.textContent='Link nicht gültig';text.textContent=decodeURIComponent(err);link.style.display='inline-block'}else if(access){DB.saveSession({access_token:access,refresh_token:refresh});if(type==='recovery'){title.textContent='Weiter zum neuen Passwort';text.textContent='Deine Identität wurde bestätigt.';setTimeout(()=>location.replace('passwort-neu.html'),500)}else{title.textContent='E-Mail bestätigt';text.textContent='Dein Konto ist jetzt bereit.';link.style.display='inline-block';setTimeout(()=>location.replace('konto.html'),900)}}else{title.textContent='Bestätigung nicht erkannt';text.textContent='Der Link enthält keine gültige Anmeldung. Bitte fordere den Vorgang erneut an.';link.style.display='inline-block'}
</script></body></html>
