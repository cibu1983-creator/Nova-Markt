<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>DeinBasar – Bestätigung</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#77777d;--line:#e5e5e8;--orange:#f26f21;--green:#2f9c59;--red:#b43a31}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px}.brand{font-size:22px;font-weight:900;margin-bottom:34px}.brand span{color:var(--orange)}.icon{width:64px;height:64px;border-radius:20px;background:#edf8f1;color:var(--green);display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:18px}.icon.error{background:#fff1ef;color:var(--red)}h1{font-size:34px;line-height:1.05;margin:0 0 12px}p{color:var(--muted);line-height:1.55;margin:0 0 18px}.btn{display:block;width:100%;border:0;border-radius:15px;padding:14px 16px;background:#171719;color:#fff;text-decoration:none;text-align:center;font-weight:850}.small{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}</style></head><body><main class="card"><div class="brand">Dein<span>Basar</span></div><div id="icon" class="icon">✓</div><h1 id="title">Wird verarbeitet …</h1><p id="text">Einen Moment, wir verbinden dein Konto mit DeinBasar.</p><a id="go" class="btn" href="konto.html">Zu Mein Konto</a><div id="small" class="small"></div></main><script>const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search);const access=hash.get('access_token')||query.get('access_token'),refresh=hash.get('refresh_token')||query.get('refresh_token'),type=hash.get('type')||query.get('type')||'',err=hash.get('error_description')||query.get('error_description')||hash.get('error')||query.get('error');const icon=document.getElementById('icon'),title=document.getElementById('title'),text=document.getElementById('text'),small=document.getElementById('small'),go=document.getElementById('go');if(access){localStorage.setItem('nova_token',access);if(refresh)localStorage.setItem('nova_refresh_token',refresh);if(type==='recovery'){title.textContent='Passwort zurücksetzen';text.textContent='Dein Sicherheitslink wurde bestätigt. Du kannst jetzt ein neues Passwort festlegen.';small.textContent='Weiterleitung …';go.href='passwort-neu.html';history.replaceState({},document.title,location.pathname);setTimeout(()=>location.replace('passwort-neu.html'),1200)}else{title.textContent='E-Mail erfolgreich bestätigt ✓';text.textContent='Dein DeinBasar-Konto ist jetzt bestätigt. Du wirst gleich zu deinem Konto weitergeleitet.';small.textContent='Weiterleitung …';history.replaceState({},document.title,location.pathname);setTimeout(()=>location.replace('konto.html?confirmed=1'),1500)}}else if(err){icon.classList.add('error');icon.textContent='!';title.textContent='Bestätigung nicht möglich';let m=decodeURIComponent(String(err).replace(/\+/g,' '));if(/expired|invalid/i.test(m))m='Dieser Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Link an.';text.textContent=m;small.textContent='Du kannst zurück zu Mein Konto gehen und es erneut versuchen.'}else{title.textContent='Link verarbeitet';text.textContent='Wenn du aus einer DeinBasar-E-Mail kommst, kannst du jetzt zu deinem Konto wechseln.';small.textContent='Falls der Link nicht funktioniert, fordere bitte einen neuen an.'}</script></body></html>
