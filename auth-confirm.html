<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>DeinBasar – E-Mail bestätigen</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#77777d;--line:#e5e5e8;--orange:#f26f21;--green:#2f9c59;--red:#b43a31}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 60px #0001}.brand{font-size:22px;font-weight:900;margin-bottom:34px}.brand span{color:var(--orange)}.icon{width:64px;height:64px;border-radius:20px;background:#edf8f1;color:var(--green);display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:18px}.icon.error{background:#fff1ef;color:var(--red)}h1{font-size:34px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 12px}p{color:var(--muted);line-height:1.55;margin:0 0 18px}.btn{display:block;width:100%;border:0;border-radius:15px;padding:14px 16px;background:#171719;color:#fff;text-decoration:none;text-align:center;font-weight:850}.small{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}</style></head><body><main class="card"><div class="brand">Dein<span>Basar</span></div><div id="icon" class="icon">✓</div><h1 id="title">E-Mail wird bestätigt …</h1><p id="text">Einen Moment, wir verbinden dein Konto mit DeinBasar.</p><a id="go" class="btn" href="konto.html">Zu Mein Konto</a><div id="small" class="small"></div></main><script>const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search);const access=hash.get('access_token')||query.get('access_token'),refresh=hash.get('refresh_token')||query.get('refresh_token'),err=hash.get('error_description')||query.get('error_description')||hash.get('error')||query.get('error');const icon=document.getElementById('icon'),title=document.getElementById('title'),text=document.getElementById('text'),small=document.getElementById('small'),go=document.getElementById('go');if(access){localStorage.setItem('nova_token',access);if(refresh)localStorage.setItem('nova_refresh_token',refresh);title.textContent='E-Mail erfolgreich bestätigt ✓';text.textContent='Dein DeinBasar-Konto ist jetzt bestätigt. Du wirst gleich zu deinem Konto weitergeleitet.';small.textContent='Weiterleitung in wenigen Sekunden …';history.replaceState({},document.title,location.pathname);setTimeout(()=>location.replace('konto.html?confirmed=1'),1800)}else if(err){icon.classList.add('error');icon.textContent='!';title.textContent='Bestätigung nicht möglich';text.textContent=decodeURIComponent(String(err).replace(/\+/g,' '));small.textContent='Der Link kann abgelaufen oder bereits verwendet worden sein.'}else{title.textContent='E-Mail bestätigt?';text.textContent='Wenn du gerade aus deiner Bestätigungs-E-Mail kommst, kannst du dich jetzt bei DeinBasar einloggen.';small.textContent='Falls du weiterhin eine 404-Seite bekommst, muss die Supabase-Weiterleitungsadresse noch angepasst werden.'}</script></body></html>
