<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>DeinBasar – Neues Passwort</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#77777d;--line:#e5e5e8;--orange:#f26f21;--green:#2f9c59;--red:#c33d33}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px}.brand{font-size:22px;font-weight:900;margin-bottom:28px}.brand span{color:var(--orange)}h1{font-size:34px;line-height:1.05;letter-spacing:-1.2px;margin:0 0 10px}p{color:var(--muted);line-height:1.5;margin:0 0 20px}.field{display:grid;gap:7px;margin-top:14px}label{font-size:13px;font-weight:800;color:#5f5f65}input{width:100%;min-height:54px;border:1px solid #dddde1;border-radius:14px;padding:14px;font-size:16px}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#171719;color:#fff;font-weight:850;margin-top:16px}.notice{margin-top:14px;padding:12px;border-radius:13px;background:#f2f2f4;color:var(--muted);font-size:12px;line-height:1.5}.notice.success{background:#edf8f1;color:#216d3d}.notice.error{background:#fff1ef;color:#992f29}.back{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:13px}</style></head><body><main class="card"><div class="brand">Dein<span>Basar</span></div><h1>Neues Passwort festlegen</h1><p id="intro">Gib dein neues Passwort zweimal ein.</p><div class="field"><label for="p1">Neues Passwort</label><input id="p1" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="p2">Passwort wiederholen</label><input id="p2" type="password" minlength="8" autocomplete="new-password"></div><button id="save" class="btn">Passwort speichern</button><div id="note" class="notice">Der Link aus deiner E-Mail wird hier sicher verarbeitet.</div><a class="back" href="konto.html">Zurück zu Mein Konto</a></main><script>const SB='https://pnyoozmgiwftnyuefsgr.supabase.co',KEY='sb_publishable_LeZfLoRAvtqTMuLHaqjxbA_1rasUioY';const hash=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search);let access=hash.get('access_token')||q.get('access_token')||localStorage.getItem('nova_token')||'',refresh=hash.get('refresh_token')||q.get('refresh_token')||'';const type=hash.get('type')||q.get('type')||'';const note=document.getElementById('note'),save=document.getElementById('save');if(access){localStorage.setItem('nova_token',access);if(refresh)localStorage.setItem('nova_refresh_token',refresh);history.replaceState({},document.title,location.pathname)}else{note.textContent='Dieser Reset-Link ist ungültig oder abgelaufen. Bitte fordere unter „Passwort vergessen?“ einen neuen Link an.';note.className='notice error';save.disabled=true}save.onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8){note.textContent='Das Passwort muss mindestens 8 Zeichen lang sein.';note.className='notice error';return}if(p1!==p2){note.textContent='Die beiden Passwörter stimmen nicht überein.';note.className='notice error';return}save.disabled=true;save.textContent='Wird gespeichert …';try{const r=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.error_description||'Passwort konnte nicht geändert werden.');note.textContent='Passwort erfolgreich geändert ✓ Du kannst dich jetzt damit anmelden.';note.className='notice success';save.textContent='Gespeichert';setTimeout(()=>location.href='konto.html?password=changed',1800)}catch(e){note.textContent=e.message;note.className='notice error';save.disabled=false;save.textContent='Passwort speichern'}};</script></body></html>
