<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeinBasar – Neues Passwort</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f6f8;color:#19191b;display:grid;min-height:100vh;place-items:center}.card{width:min(480px,calc(100% - 28px));background:#fff;border:1px solid #e6e6ea;border-radius:24px;padding:22px}.logo{font-size:22px;font-weight:950}.logo span{color:#f26f21}h1{font-size:32px;letter-spacing:-1px;margin:18px 0 8px}.muted{color:#73737a;font-size:13px;line-height:1.5}.field{margin-top:15px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;height:52px;border:1px solid #d9d9de;border-radius:12px;padding:0 13px;font:inherit;font-size:16px}.btn{width:100%;margin-top:12px;border:0;border-radius:13px;padding:13px;background:#19191b;color:#fff;font:inherit;font-weight:850}.notice{margin-top:12px;padding:12px;border-radius:12px;background:#f1f1f3;color:#73737a;font-size:12px}.ok{background:#edf8f1;color:#237746}.bad{background:#fff0ee;color:#a1322d}.link{display:block;text-align:center;margin-top:14px;color:#19191b}</style></head><body><div class="card"><div class="logo">dein<span>basar</span>.de</div><h1>Neues Passwort</h1><div class="muted">Vergib ein neues Passwort mit mindestens 8 Zeichen.</div><form id="form"><div class="field"><label>Neues Passwort</label><input id="p1" type="password" minlength="10" required autocomplete="new-password"></div><div class="field"><label>Noch einmal</label><input id="p2" type="password" minlength="10" required autocomplete="new-password"></div><button id="save" class="btn" type="submit">Passwort speichern</button></form><div id="notice" class="notice">Der Link aus der Reset-E-Mail meldet dich für diesen Schritt sicher an.</div><a class="link" href="konto.html">Zurück zum Konto</a></div><script src="app-core.js"></script><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));const access=h.get('access_token')||q.get('access_token'),refresh=h.get('refresh_token')||q.get('refresh_token');if(access)DB.saveSession({access_token:access,refresh_token:refresh});function note(t,c=''){$('notice').textContent=t;$('notice').className='notice'+(c?' '+c:'')}
$('form').onsubmit=async e=>{e.preventDefault();const a=$('p1').value,b=$('p2').value;if(a.length<8)return note('Das Passwort muss mindestens 8 Zeichen haben.','bad');if(a!==b)return note('Die Passwörter stimmen nicht überein.','bad');$('save').disabled=true;try{await DB.authRequest('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:a})});note('Passwort gespeichert. Du kannst dich jetzt damit anmelden.','ok');setTimeout(()=>location.replace('konto.html'),1200)}catch(err){note(err.message==='Nicht angemeldet'?'Der Reset-Link ist abgelaufen oder ungültig. Bitte fordere einen neuen an.':err.message,'bad')}finally{$('save').disabled=false}};
</script></body></html>
