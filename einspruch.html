<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>DeinBasar – Einspruch</title><style>:root{--o:#f26f21;--t:#19191b;--m:#73737a;--l:#e5e5e9;--bg:#f6f6f8;--bad:#a1322d;--ok:#237746;--warn:#9b5c00}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,textarea{font:inherit}a{color:inherit}.wrap{width:min(720px,calc(100% - 24px));margin:auto}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:64px;display:flex;align-items:center}.brand{font-size:21px;font-weight:950;text-decoration:none}.brand span{color:var(--o)}.back{margin-left:auto;text-decoration:none;color:var(--m);font-weight:800}.hero{padding:34px 0 16px}.hero h1{font-size:clamp(34px,7vw,50px);letter-spacing:-2px;line-height:1;margin:0 0 10px}.muted{color:var(--m);font-size:13px;line-height:1.55}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:20px;margin-bottom:14px}.notice{padding:12px;border-radius:13px;background:#f1f1f3;color:var(--m);font-size:12px;line-height:1.5}.notice.warn{background:#fff7e8;color:var(--warn)}.notice.ok{background:#edf8f1;color:var(--ok)}.notice.bad{background:#fff0ee;color:var(--bad)}textarea{width:100%;min-height:160px;border:1px solid #d8d8dd;border-radius:13px;padding:13px;margin-top:12px;resize:vertical}.btn{border:0;border-radius:13px;padding:13px 16px;background:#19191b;color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center}.btn.orange{background:var(--o)}.btn:disabled{opacity:.55}.hidden{display:none!important}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a class="back" href="konto.html">← Mein Konto</a></nav></header><main class="wrap"><section class="hero"><h1>Einspruch gegen eine Prüfung.</h1><p class="muted">Wenn eine Anzeige durch eine Sicherheits- oder Moderationsprüfung zurückgehalten wurde und du die Entscheidung für falsch hältst, kannst du hier eine erneute Prüfung beantragen.</p></section><section id="gate" class="card hidden"></section><section id="box" class="card hidden"><h2 id="title" style="margin-top:0">Anzeige</h2><div id="reason" class="notice warn"></div><div id="existing" class="notice hidden" style="margin-top:10px"></div><form id="form"><textarea id="text" minlength="20" maxlength="3000" required placeholder="Erkläre bitte konkret, warum die Anzeige deiner Ansicht nach zulässig ist und welche Angaben die Prüfung berücksichtigen soll."></textarea><div id="notice" class="notice" style="margin-top:10px">Keine Passwörter, TANs oder Zahlungsdaten eintragen.</div><button id="send" class="btn orange" type="submit" style="width:100%;margin-top:12px">Einspruch absenden</button></form></section></main><script src="app-core.js?v=14"></script><script>const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('listing');let me,item;function note(t,c=''){$('notice').textContent=t;$('notice').className='notice'+(c?' '+c:'')}async function init(){if(!id){$('gate').innerHTML='<h2>Anzeige fehlt</h2><p class="muted">Keine Anzeigen-ID angegeben.</p>';$('gate').classList.remove('hidden');return}try{me=await DB.user()}catch{$('gate').innerHTML='<h2>Bitte einloggen</h2><p class="muted">Nur der Eigentümer der Anzeige kann Einspruch einlegen.</p><a class="btn orange" href="'+DB.loginUrl('einspruch.html?listing='+encodeURIComponent(id))+'">Zum Login</a>';$('gate').classList.remove('hidden');return}try{item=(await DB.authRequest('/rest/v1/listings?id=eq.'+encodeURIComponent(id)+'&seller_id=eq.'+me.id+'&select=id,title,moderation_status,moderation_reason&limit=1'))?.[0];if(!item)throw Error('Anzeige nicht gefunden.');$('title').textContent=item.title;$('reason').textContent=item.moderation_status==='pending'||item.moderation_status==='blocked'?(item.moderation_reason||'Die Anzeige wurde zur Prüfung zurückgehalten.'):'Für diese Anzeige liegt aktuell keine Moderationssperre vor.';$('box').classList.remove('hidden');const a=(await DB.authRequest('/rest/v1/moderation_appeals?listing_id=eq.'+id+'&appellant_id=eq.'+me.id+'&select=id,status,created_at,decision_reason&order=created_at.desc&limit=1'))?.[0];if(a){$('existing').classList.remove('hidden');$('existing').textContent='Letzter Einspruch: '+a.status+(a.decision_reason?' · '+a.decision_reason:'');if(['received','reviewing'].includes(a.status)){$('form').classList.add('hidden')}}if(!['pending','blocked'].includes(item.moderation_status))$('form').classList.add('hidden')}catch(e){$('gate').innerHTML='<h2>Nicht verfügbar</h2><p class="muted">'+DB.esc(e.message||'Fehler')+'</p>';$('gate').classList.remove('hidden')}}$('form').onsubmit=async e=>{e.preventDefault();const b=$('send');b.disabled=true;try{await DB.authRequest('/rest/v1/moderation_appeals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id:item.id,appellant_id:me.id,reason:$('text').value.trim()})});note('Einspruch gespeichert. Die Anzeige bleibt bis zur Prüfung nicht öffentlich sichtbar.','ok');b.style.display='none'}catch(e){note(e.message||'Einspruch konnte nicht gespeichert werden.','bad')}finally{b.disabled=false}};init();</script></body></html>
