<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>DeinBasar – Moderation</title><style>:root{--o:#f26f21;--t:#19191b;--m:#6f7077;--l:#e4e4e8;--bg:#f6f6f8;--ok:#237746;--bad:#a1322d;--warn:#9b5c00}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,input,textarea,select{font:inherit}a{color:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(18px);border-bottom:1px solid var(--l)}nav{min-height:64px;display:flex;align-items:center;gap:8px}.brand{font-size:21px;font-weight:950;text-decoration:none}.brand span{color:var(--o)}.navright{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#19191b;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.orange{background:var(--o)}.btn.light{background:#fff;color:#19191b;border:1px solid var(--l)}.btn.good{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:#fff7e8;color:var(--warn);border:1px solid #efcf8e}.btn.small{font-size:12px;padding:8px 10px}.btn:disabled{opacity:.55}.hero{padding:26px 0 12px}.hero h1{font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:-2px;margin:0 0 8px}.muted{color:var(--m);font-size:12px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 16px}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--m);font-weight:850}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px;position:sticky;top:65px;z-index:10;background:var(--bg)}.tabs button{white-space:nowrap;border:1px solid var(--l);background:#fff;padding:9px 11px;border-radius:11px;font-weight:850;color:var(--m)}.tabs button.on{background:#19191b;color:#fff;border-color:#19191b}.panel{display:none;padding-bottom:50px}.panel.on{display:block}.queue{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:16px}.card h3{margin:0 0 6px;font-size:18px}.cardTop{display:flex;gap:10px;align-items:flex-start}.grow{flex:1;min-width:0}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f1f1f3;font-size:10px;font-weight:900;margin:2px 4px 2px 0}.badge.warn{background:#fff7e8;color:var(--warn)}.badge.bad{background:#fff0ee;color:var(--bad)}.badge.ok{background:#edf8f1;color:var(--ok)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.kv{background:#f6f6f8;border-radius:12px;padding:10px;min-width:0}.kv b{display:block;font-size:10px;margin-bottom:3px}.kv span,.kv a{font-size:12px;color:#555;word-break:break-word}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.desc{white-space:pre-wrap;font-size:12px;line-height:1.55;color:#555;margin-top:8px}.pic{width:92px;height:72px;border-radius:12px;overflow:hidden;background:#eee;display:grid;place-items:center;color:#999;flex:none}.pic img{width:100%;height:100%;object-fit:cover}.empty{padding:24px;border:1px dashed #cfcfd5;border-radius:16px;text-align:center;color:var(--m);background:#fff}.gate{margin-top:30px;background:#fff;border:1px solid var(--l);border-radius:22px;padding:24px}.hidden{display:none!important}dialog{border:0;border-radius:20px;width:min(560px,calc(100% - 20px));padding:0}dialog::backdrop{background:#0008}.dialogBody{padding:18px}.dialogBody h3{margin:0 0 7px}.dialogBody textarea,.dialogBody input,.dialogBody select{width:100%;border:1px solid #d8d8dd;border-radius:12px;padding:11px 12px;margin-top:10px}.dialogBody textarea{min-height:120px;resize:vertical}.dialogActions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.audit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-word}.refresh{margin-left:auto}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}.cardTop{flex-wrap:wrap}.pic{width:100%;height:160px}.navright .hideMob{display:none}.tabs{top:64px}.hero{padding-top:20px}}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><div class="navright"><a class="btn light" href="konto.html">Konto</a><a class="btn light hideMob" href="basar.html">Basar</a></div></nav></header><main class="wrap"><section class="hero"><h1>Moderation & Betrieb</h1><div class="muted">Interne Warteschlangen für Händlerprüfung, Inhaltsmoderation, Meldungen, Datenschutz und Sicherheitsereignisse.</div></section><section id="gate" class="gate"><b>Zugriff wird geprüft …</b></section><section id="app" class="hidden"><div class="stats"><div class="stat"><b id="nMerchants">0</b><span>HÄNDLER</span></div><div class="stat"><b id="nListings">0</b><span>ANZEIGEN</span></div><div class="stat"><b id="nAppeals">0</b><span>EINSPRÜCHE</span></div><div class="stat"><b id="nLegal">0</b><span>RECHTSMELDUNGEN</span></div><div class="stat"><b id="nReports">0</b><span>NUTZERMELDUNGEN</span></div><div class="stat"><b id="nPrivacy">0</b><span>DATENSCHUTZ</span></div></div><div class="tabs" id="tabs"><button data-tab="merchants" class="on">Händler</button><button data-tab="listings">Anzeigen</button><button data-tab="appeals">Einsprüche</button><button data-tab="legal">Rechtsmeldungen</button><button data-tab="reports">Meldungen</button><button data-tab="privacy">Datenschutz</button><button data-tab="safety">Sicherheit</button><button data-tab="audit">Audit</button><button class="refresh" id="refresh">↻</button></div><section id="merchants" class="panel on"><div class="queue" id="merchantList"></div></section><section id="listings" class="panel"><div class="queue" id="listingList"></div></section><section id="appeals" class="panel"><div class="queue" id="appealList"></div></section><section id="legal" class="panel"><div class="queue" id="legalList"></div></section><section id="reports" class="panel"><div class="queue" id="reportList"></div></section><section id="privacy" class="panel"><div class="queue" id="privacyList"></div></section><section id="safety" class="panel"><div class="queue" id="safetyList"></div></section><section id="audit" class="panel"><div class="queue" id="auditList"></div></section></section></main><dialog id="actionDialog"><form method="dialog" class="dialogBody" id="actionForm"><h3 id="dialogTitle">Entscheidung</h3><div id="dialogHint" class="muted"></div><textarea id="decisionReason" required minlength="5" maxlength="3000" placeholder="Begründung / interne Prüfnotiz"></textarea><div id="extraFields"></div><div class="dialogActions"><button class="btn light" value="cancel" type="button" id="cancelDialog">Abbrechen</button><button class="btn orange" value="default" type="submit" id="confirmDialog">Bestätigen</button></div></form></dialog><script src="app-core.js?v=17"></script><script>const $=id=>document.getElementById(id);let data=null,pendingAction=null;const esc=DB.esc;function empty(t){return '<div class="empty">'+esc(t)+'</div>'}function kv(k,v,full=false){if(v===null||v===undefined||v==='')return'';return '<div class="kv '+(full?'full':'')+'"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>'}function badge(v,c=''){return '<span class="badge '+c+'">'+esc(v)+'</span>'}async function rpc(name,body={}){return DB.authRequest('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function init(){if(!DB.token()){location.href=DB.loginUrl('admin.html');return}try{const who=await rpc('admin_whoami');const x=Array.isArray(who)?who[0]:who;if(!x?.is_admin){$('gate').innerHTML='<h2>Kein Admin-Zugriff</h2><p class="muted">Dieses Konto besitzt keine Moderationsrolle.</p><a class="btn light" href="konto.html">Zurück zum Konto</a>';return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('gate').innerHTML='<h2>Zugriff fehlgeschlagen</h2><p class="muted">'+esc(e.message||'Unbekannter Fehler')+'</p>'}}async function load(){const b=$('refresh');b.disabled=true;try{data=await rpc('admin_dashboard',{p_limit:100});render();await loadAudit()}catch(e){alert(e.message||'Moderation konnte nicht geladen werden.')}finally{b.disabled=false}}function render(){const d=data||{};$('nMerchants').textContent=(d.merchants||[]).length;$('nListings').textContent=(d.listings||[]).length;$('nAppeals').textContent=(d.appeals||[]).length;$('nLegal').textContent=(d.legal_notices||[]).length;$('nReports').textContent=(d.reports||[]).length;$('nPrivacy').textContent=(d.privacy_requests||[]).length;renderMerchants(d.merchants||[]);renderListings(d.listings||[]);renderAppeals(d.appeals||[]);renderLegal(d.legal_notices||[]);renderReports(d.reports||[]);renderPrivacy(d.privacy_requests||[]);renderSafety(d.safety_events||[])}function renderMerchants(rows){$('merchantList').innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="cardTop"><div class="grow"><h3>'+esc(x.name||x.business_name||'Händler')+'</h3>'+badge(x.trader_verification_status||'pending','warn')+badge(x.status||'pending')+'</div></div><div class="grid">'+kv('Unternehmen',x.business_name)+kv('Rechtsform',x.legal_form)+kv('Vertretung',x.representative_name)+kv('Kontakt',[(x.contact_email||''),(x.contact_phone||'')].filter(Boolean).join(' · '))+kv('Anschrift',[x.street,x.house_number,[x.postal_code,x.city].filter(Boolean).join(' ')].filter(Boolean).join(', '),true)+kv('Register',x.trade_register,true)+kv('USt-ID / W-Id',[(x.vat_id||''),(x.economic_id||'')].filter(Boolean).join(' · '))+kv('Selbstbestätigung',x.trader_self_certified_at?DB.date(x.trader_self_certified_at):'fehlt')+kv('Anbieterinformationen',x.imprint_text,true)+kv('Widerruf / Rückgabe',x.returns_info,true)+'</div><div class="actions"><button class="btn good small" onclick="merchantAction(\''+x.id+'\',true)">Prüfen & freigeben</button><button class="btn bad small" onclick="merchantAction(\''+x.id+'\',false)">Ablehnen</button></div></article>').join(''):empty('Keine Händlerprüfung offen.')}function renderListings(rows){$('listingList').innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="cardTop">'+(x.image_urls?.[0]?'<div class="pic"><img src="'+esc(x.image_urls[0])+'" alt=""></div>':'<div class="pic">Kein Bild</div>')+'<div class="grow"><h3>'+esc(x.title)+'</h3>'+badge(x.moderation_status,x.moderation_status==='blocked'?'bad':'warn')+badge('Risiko '+x.risk_score,(x.risk_score||0)>=60?'bad':'warn')+(x.compliance_hold?badge('Compliance Hold','warn'):'')+'<div class="muted">'+esc(x.category||'')+' · '+DB.euro(x.price)+' · '+esc(x.location||'')+'</div></div></div><div class="desc">'+esc(x.description||'')+'</div><div class="grid">'+kv('Risikoflags',(x.risk_flags||[]).join(', ')||'keine',true)+kv('Grund',x.moderation_reason||'Automatische Prüfung',true)+'</div><div class="actions"><button class="btn good small" onclick="listingAction(\''+x.id+'\',true)">Freigeben</button><button class="btn bad small" onclick="listingAction(\''+x.id+'\',false)">Blockieren</button></div></article>').join(''):empty('Keine Anzeige wartet auf Moderation.')}function renderAppeals(rows){$('appealList').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>'+esc(x.listing_title||'Anzeige')+'</h3>'+badge(x.status,'warn')+'<div class="grid">'+kv('Einspruch',x.reason,true)+kv('Eingang',DB.date(x.created_at))+'</div><div class="actions"><button class="btn good small" onclick="appealAction(\''+x.id+'\',true)">Entscheidung aufheben</button><button class="btn bad small" onclick="appealAction(\''+x.id+'\',false)">Entscheidung bestätigen</button></div></article>').join(''):empty('Keine Einsprüche offen.')}function renderLegal(rows){$('legalList').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>Rechtsmeldung</h3>'+badge(x.status,'warn')+'<div class="grid">'+kv('Grund',x.legal_basis,true)+kv('Begründung',x.explanation,true)+kv('URL',x.content_url,true)+kv('Meldender Kontakt',x.reporter_email)+kv('Eingang',DB.date(x.created_at))+'</div><div class="actions"><button class="btn light small" onclick="legalAction(\''+x.id+'\',\'reviewing\',false)">In Prüfung</button><button class="btn bad small" onclick="legalAction(\''+x.id+'\',\'actioned\',true)">Maßnahme + ausblenden</button><button class="btn light small" onclick="legalAction(\''+x.id+'\',\'rejected\',false)">Keine Maßnahme</button><button class="btn light small" onclick="legalAction(\''+x.id+'\',\'closed\',false)">Schließen</button></div></article>').join(''):empty('Keine Rechtsmeldungen offen.')}function renderReports(rows){$('reportList').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>Nutzermeldung #'+esc(x.id)+'</h3>'+badge(x.status,'warn')+'<div class="grid">'+kv('Grund',x.reason,true)+kv('Details',x.details,true)+kv('Anzeige',x.listing_id)+kv('Shop',x.shop_id)+kv('Unterhaltung',x.conversation_id)+kv('Gemeldeter Nutzer',x.reported_user_id)+kv('Eingang',DB.date(x.created_at))+'</div><div class="actions"><button class="btn light small" onclick="reportAction('+x.id+',\'reviewing\')">In Prüfung</button><button class="btn good small" onclick="reportAction('+x.id+',\'closed\')">Abschließen</button></div></article>').join(''):empty('Keine Nutzermeldungen offen.')}function renderPrivacy(rows){const labels={access:'Auskunft',correction:'Berichtigung',deletion:'Löschung',restriction:'Einschränkung',objection:'Widerspruch',portability:'Datenübertragbarkeit'};$('privacyList').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>'+esc(labels[x.request_type]||x.request_type)+'</h3>'+badge(x.status,'warn')+'<div class="grid">'+kv('Konto',x.user_email||x.user_id)+kv('Details',x.details||'–',true)+kv('Eingang',DB.date(x.created_at))+'</div>'+(x.request_type==='deletion'?'<div class="muted" style="margin-top:9px"><b>Löschung:</b> Erst nach Prüfung offener Vorgänge und Aufbewahrungspflichten als erledigt markieren. Diese Konsole löscht nicht blind automatisch.</div>':'')+'<div class="actions"><button class="btn light small" onclick="privacyAction(\''+x.id+'\',\'reviewing\')">In Prüfung</button><button class="btn good small" onclick="privacyAction(\''+x.id+'\',\'completed\')">Erledigt</button><button class="btn bad small" onclick="privacyAction(\''+x.id+'\',\'rejected\')">Ablehnen</button></div></article>').join(''):empty('Keine Datenschutzanfragen offen.')}function renderSafety(rows){$('safetyList').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>'+esc(x.event_type)+'</h3>'+badge(x.severity,x.severity==='critical'||x.severity==='high'?'bad':'warn')+'<div class="grid">'+kv('Nutzer',x.display_name||x.actor_id)+kv('Objekt',[x.object_type,x.object_id].filter(Boolean).join(' · '))+kv('Zeit',DB.date(x.created_at))+kv('Details',JSON.stringify(x.details||{}),true)+'</div></article>').join(''):empty('Keine hohen Sicherheitsereignisse im aktuellen Fenster.')}async function loadAudit(){try{const rows=await rpc('admin_audit_recent',{p_limit:100});$('auditList').innerHTML=rows.length?rows.map(x=>'<article class="card audit"><b>'+esc(x.action)+'</b> · '+esc(x.object_type)+' · '+esc(x.object_id||'')+'<div class="muted">'+esc(DB.date(x.created_at))+'</div><div>'+esc(JSON.stringify(x.details||{}))+'</div></article>').join(''):empty('Noch keine Admin-Aktionen protokolliert.')}catch(e){$('auditList').innerHTML=empty('Audit konnte nicht geladen werden.')}}function openDecision(title,hint,extra,fn){pendingAction=fn;$('dialogTitle').textContent=title;$('dialogHint').textContent=hint||'';$('decisionReason').value='';$('extraFields').innerHTML=extra||'';$('actionDialog').showModal()}$('cancelDialog').onclick=()=>{$('actionDialog').close();pendingAction=null};$('actionForm').onsubmit=async e=>{e.preventDefault();if(!pendingAction)return;const reason=$('decisionReason').value.trim();if(reason.length<5)return;const b=$('confirmDialog');b.disabled=true;try{await pendingAction(reason);$('actionDialog').close();pendingAction=null;await load()}catch(err){alert(err.message||'Aktion fehlgeschlagen.')}finally{b.disabled=false}};window.merchantAction=(id,approve)=>openDecision(approve?'Händler freigeben':'Händler ablehnen',approve?'Prüfung dokumentieren. Freigabe macht den Händler öffentlich, sofern die Pflichtangaben vollständig sind.':'Begründe, warum die Händlerprüfung nicht bestanden wurde.','<input id="verifyRef" maxlength="500" placeholder="Prüfreferenz / Registerfundstelle (optional)">',async reason=>rpc('admin_verify_merchant',{p_shop_id:id,p_approve:approve,p_reason:reason,p_method:'manual',p_reference:$('verifyRef')?.value.trim()||null}));window.listingAction=(id,approve)=>openDecision(approve?'Anzeige freigeben':'Anzeige blockieren','Dokumentiere die konkrete Moderationsentscheidung.','',reason=>rpc('admin_decide_listing',{p_listing_id:id,p_approve:approve,p_reason:reason}));window.appealAction=(id,reverse)=>openDecision(reverse?'Einspruch stattgeben':'Einspruch zurückweisen','Die Begründung wird dem betroffenen Nutzer im Einspruchsstatus angezeigt.','',reason=>rpc('admin_decide_appeal',{p_appeal_id:id,p_reverse:reverse,p_reason:reason}));window.legalAction=(id,status,hide)=>openDecision('Rechtsmeldung: '+status,hide?'Die betroffenen Inhalte werden zusätzlich aus der öffentlichen Sichtbarkeit genommen.':'Dokumentiere das Ergebnis der Prüfung.','',reason=>rpc('admin_decide_legal_notice',{p_notice_id:id,p_status:status,p_reason:reason,p_hide_content:hide}));window.reportAction=(id,status)=>openDecision('Nutzermeldung: '+status,'Optional kann bei Abschluss zusätzlich eine Kontoeinschränkung gesetzt werden.',status==='closed'?'<select id="accountAction"><option value="none">Keine Kontoaktion</option><option value="restrict_24h">24 Stunden einschränken</option><option value="restrict_7d">7 Tage einschränken</option><option value="suspend">Konto sperren</option></select>':'',reason=>rpc('admin_decide_report',{p_report_id:id,p_status:status,p_reason:reason,p_account_action:$('accountAction')?.value||'none'}));window.privacyAction=(id,status)=>openDecision('Datenschutzanfrage: '+status,status==='completed'?'Nur als erledigt markieren, wenn die eigentliche Anfrage tatsächlich erfüllt wurde.':'Prüf- oder Entscheidungsnotiz angeben.','',reason=>rpc('admin_decide_privacy_request',{p_request_id:id,p_status:status,p_reason:reason}));$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{$('tabs').querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.tab))});$('refresh').onclick=load;init();</script></body></html>
