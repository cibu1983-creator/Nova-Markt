<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>DeinBasar – Meldungsstatus</title><style>:root{--o:#f26f21;--t:#19191b;--m:#73737a;--l:#e5e5e9;--bg:#f6f6f8;--ok:#237746;--bad:#a1322d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,input{font:inherit}a{color:inherit}.wrap{width:min(700px,calc(100% - 24px));margin:auto}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:64px;display:flex;align-items:center}.brand{font-size:21px;font-weight:950;text-decoration:none}.brand span{color:var(--o)}.back{margin-left:auto;text-decoration:none;color:var(--m);font-weight:800}.hero{padding:36px 0 16px}.hero h1{font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:-2px;margin:0 0 12px}.muted{color:var(--m);font-size:13px;line-height:1.55}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:20px;margin-bottom:14px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input{width:100%;border:1px solid #d8d8dd;border-radius:12px;padding:12px 13px;background:#fff;height:50px;font-size:16px}.btn{border:0;border-radius:13px;padding:13px 16px;background:var(--o);color:#fff;font-weight:900;cursor:pointer;width:100%;margin-top:14px}.notice{padding:12px;border-radius:13px;background:#f1f1f3;color:var(--m);font-size:12px;line-height:1.5;margin-top:14px}.notice.ok{background:#edf8f1;color:var(--ok)}.notice.bad{background:#fff0ee;color:var(--bad)}.status{font-size:24px;font-weight:950;margin-bottom:8px}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a class="back" href="melden.html">← Meldeformular</a></nav></header><main class="wrap"><section class="hero"><h1>Status einer Meldung prüfen.</h1><p class="muted">Für den Schutz der Meldenden werden Referenznummer und dieselbe E-Mail-Adresse benötigt, die beim Absenden verwendet wurde.</p></section><section class="card"><form id="f"><div class="field"><label>Referenznummer</label><input id="id" required autocomplete="off"></div><div class="field"><label>E-Mail-Adresse</label><input id="email" type="email" required autocomplete="email"></div><button class="btn" id="check" type="submit">Status prüfen</button></form><div id="out" class="notice">Noch nicht geprüft.</div></section></main><script src="app-core.js?v=16"></script><script>const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);$('id').value=p.get('id')||'';function label(s){return({received:'Eingegangen',reviewing:'In Prüfung',actioned:'Maßnahme erfolgt',rejected:'Keine Maßnahme',closed:'Abgeschlossen'})[s]||s||'Unbekannt'}$('f').onsubmit=async e=>{e.preventDefault();const b=$('check');b.disabled=true;try{const r=await fetch(DB.url+'/rest/v1/rpc/check_legal_notice_status',{method:'POST',headers:{apikey:DB.key,'Content-Type':'application/json'},body:JSON.stringify({p_notice_id:$('id').value.trim(),p_reporter_email:$('email').value.trim()})});const j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.message||'Status konnte nicht geladen werden.');const x=Array.isArray(j)?j[0]:null;if(!x)throw Error('Keine passende Meldung gefunden. Prüfe Referenznummer und E-Mail.');$('out').className='notice ok';$('out').innerHTML='<div class="status">'+DB.esc(label(x.status))+'</div><div>Eingang: '+DB.esc(DB.date(x.created_at))+'</div>'+(x.decided_at?'<div>Entscheidung: '+DB.esc(DB.date(x.decided_at))+'</div>':'')+(x.decision_reason?'<div style="margin-top:8px"><b>Begründung:</b> '+DB.esc(x.decision_reason)+'</div>':'')}catch(err){$('out').className='notice bad';$('out').textContent=err.message||'Prüfung fehlgeschlagen.'}finally{b.disabled=false}};</script></body></html>
