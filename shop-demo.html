<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Mode Store Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}.top{height:60px;display:flex;align-items:center;padding:0 14px;gap:10px;background:#0a0d13;border-bottom:1px solid #ffffff18}.brand{font-weight:950;font-size:20px}.brand small{display:block;color:#68cfff;font-size:9px;letter-spacing:1.4px}.spacer{flex:1}.save{border:0;border-radius:11px;background:#1677ff;padding:10px 13px;font-weight:900}.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 60px)}aside{padding:14px;background:#0c1017;border-right:1px solid #ffffff18;overflow:auto}.sect{font-size:10px;color:#77869a;font-weight:900;letter-spacing:1.2px;margin:14px 0 7px}.rooms,.assets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{border:1px solid #ffffff18;background:#131923;border-radius:12px;padding:9px;text-align:left}.card.active{border-color:#4ac8ff;background:#11273b}.card b{font-size:12px;display:block}.card small{font-size:9px;color:#8290a3}.asset{min-height:70px}.asset .ico{font-size:23px;margin-bottom:5px}.main{padding:9px;min-width:0}.bar{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.bar button{flex:none;border:1px solid #ffffff18;background:#111722;border-radius:10px;padding:8px 10px}.stage{height:calc(100vh - 122px);min-height:580px;position:relative;overflow:hidden;border:1px solid #ffffff1c;border-radius:18px;background:#111}.room{position:absolute;inset:0;transition:.25s}.room.light{background:linear-gradient(150deg,#faf9f5 0 20%,#e7e4dc 20% 50%,#c9c4ba 50% 51%,#e7e2d9 51%)}.room.dark{background:linear-gradient(150deg,#17191e 0 20%,#25282e 20% 50%,#111317 50% 51%,#24262a 51%)}.room.concrete{background:linear-gradient(150deg,#b8b7b2 0 20%,#888a89 20% 50%,#666 50% 51%,#aaa8a2 51%)}.room.premium{background:linear-gradient(150deg,#f1ede4 0 20%,#d6c6aa 20% 50%,#8b7354 50% 51%,#e5ddd0 51%)}.room:before{content:'';position:absolute;left:12%;right:12%;top:7%;height:48%;border-left:2px solid #ffffff33;border-right:2px solid #0002;box-shadow:inset 0 0 80px #0002}.room:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-28%;height:63%;transform:perspective(500px) rotateX(58deg);background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 90px),repeating-linear-gradient(#ffffff08 0 1px,transparent 1px 90px)}#wrap{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}.badge{position:absolute;left:12px;top:12px;padding:9px 11px;border-radius:11px;background:#080b11cc;border:1px solid #ffffff20;z-index:3}.badge b{display:block;font-size:12px}.badge small{color:#91a0b2;font-size:9px}.help{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);background:#080b11d9;border:1px solid #ffffff20;border-radius:99px;padding:8px 11px;font-size:10px;white-space:nowrap}.mobileLib{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:none}.main{padding:7px}.stage{height:73vh;min-height:500px}.mobileLib{display:flex;gap:6px;overflow:auto;padding-bottom:7px}.mobileLib button{flex:none;border:1px solid #ffffff1b;background:#121822;border-radius:10px;padding:8px 10px}.top{height:56px}.brand{font-size:18px}}</style></head><body><header class="top"><div class="brand">DeinBasar<small>MODE STORE BUILDER</small></div><div class="spacer"></div><button class="save" id="save">Store speichern</button></header><div class="app"><aside><div class="sect">RAUM AUSWÄHLEN</div><div class="rooms"><button class="card active" data-room="light"><b>Heller Store</b><small>Clean · Fashion</small></button><button class="card" data-room="dark"><b>Dunkler Store</b><small>Urban · Night</small></button><button class="card" data-room="concrete"><b>Industrial</b><small>Beton · Street</small></button><button class="card" data-room="premium"><b>Premium</b><small>Warm · Boutique</small></button></div><div class="sect">MODE · EINRICHTUNG</div><div class="assets"><button class="card asset" data-add="shelf"><span class="ico">▤</span><b>Regal</b><small>Produkte / Schuhe</small></button><button class="card asset" data-add="rack"><span class="ico">♧</span><b>Kleiderständer</b><small>Fashion Rail</small></button><button class="card asset" data-add="table"><span class="ico">▱</span><b>Verkaufstisch</b><small>Kollektion</small></button><button class="card asset" data-add="case"><span class="ico">▣</span><b>Vitrine</b><small>Premium Artikel</small></button><button class="card asset" data-add="pedestal"><span class="ico">▰</span><b>Podest</b><small>Hero Product</small></button><button class="card asset" data-add="mirror"><span class="ico">▯</span><b>Spiegel</b><small>Wandobjekt</small></button></div><div class="sect">MARKETING · RETAIL MEDIA</div><div class="assets"><button class="card asset" data-add="screen"><span class="ico">▣</span><b>Digital Screen</b><small>Video / Kampagne</small></button><button class="card asset" data-add="billboard"><span class="ico">▭</span><b>OOH Fläche</b><small>Brand Campaign</small></button><button class="card asset" data-add="sale"><span class="ico">%</span><b>SALE Stele</b><small>Promotion</small></button><button class="card asset" data-add="logo"><span class="ico">✦</span><b>Leuchtlogo</b><small>Branding</small></button></div></aside><main class="main"><div class="mobileLib"><button data-room="light">☀ Hell</button><button data-room="dark">● Dunkel</button><button data-room="concrete">▧ Industrial</button><button data-room="premium">◆ Premium</button><button data-add="shelf">+ Regal</button><button data-add="rack">+ Ständer</button><button data-add="table">+ Tisch</button><button data-add="case">+ Vitrine</button><button data-add="screen">+ Screen</button><button data-add="billboard">+ OOH</button></div><div class="bar"><button id="left">↶ Drehen</button><button id="right">↷ Drehen</button><button id="smaller">− Kleiner</button><button id="bigger">+ Größer</button><button id="copy">Duplizieren</button><button id="del">Löschen</button></div><section class="stage" id="stage"><div class="room light" id="room"></div><div id="wrap"></div><div class="badge"><b id="roomName">Mode · Heller Store</b><small>3D Einrichtung + Marketingflächen</small></div><div class="help">Objekt antippen & ziehen · Tiefe verändert Perspektive automatisch</div></section></main></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap'),room=document.querySelector('#room');const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;wrap.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,3.2,8);camera.lookAt(0,1,-1.7);scene.add(new THREE.HemisphereLight(0xffffff,0x30333a,2.4));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(-4,7,5);dl.castShadow=true;scene.add(dl);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.28}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const objs=[];let sel=null,drag=false;const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const M={dark:new THREE.MeshStandardMaterial({color:0x171a20,metalness:.55,roughness:.38}),metal:new THREE.MeshStandardMaterial({color:0x747b84,metalness:.8,roughness:.25}),wood:new THREE.MeshStandardMaterial({color:0x79543b,roughness:.55}),white:new THREE.MeshStandardMaterial({color:0xe9e6df,roughness:.5}),glass:new THREE.MeshPhysicalMaterial({color:0xbdeaff,transparent:true,opacity:.25,transmission:.55,roughness:.08}),screen:new THREE.MeshStandardMaterial({color:0x102846,emissive:0x168cff,emissiveIntensity:1.1})};function box(w,h,d,m,x=0,y=0,z=0){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;return q}function finish(g,n){g.name=n;g.userData.root=1;g.position.set((Math.random()-.5)*2,0,-.4-Math.random()*2);objs.push(g);scene.add(g);sel=g;return g}function build(t){let g=new THREE.Group();if(t==='shelf'){g.add(box(2.5,.1,.6,M.dark,0,.1));[-1.18,1.18].forEach(x=>g.add(box(.1,2.2,.55,M.metal,x,1.1)));[.55,1.1,1.65,2.15].forEach(y=>g.add(box(2.4,.07,.55,M.metal,0,y)));return finish(g,'Regal')}if(t==='rack'){g.add(box(2.1,.1,.5,M.dark,0,.08));[-.9,.9].forEach(x=>g.add(box(.08,1.8,.08,M.metal,x,.9)));g.add(box(1.9,.08,.08,M.metal,0,1.78));for(let i=0;i<6;i++)g.add(box(.22,.65,.1,new THREE.MeshStandardMaterial({color:[0x111111,0xd8c9ac,0x87404c,0x496075,0xe7e4dd,0x48634c][i]}),-.65+i*.26,1.35));return finish(g,'Kleiderständer')}if(t==='table'){g.add(box(2.2,.16,1,M.wood,0,1));[-.85,.85].forEach(x=>[-.35,.35].forEach(z=>g.add(box(.1,1,.1,M.dark,x,.5,z))));return finish(g,'Verkaufstisch')}if(t==='case'){g.add(box(2,.12,.8,M.dark,0,.08));g.add(box(1.9,1.35,.7,M.glass,0,.82));g.add(box(2,.1,.8,M.dark,0,1.5));return finish(g,'Glasvitrine')}if(t==='pedestal'){g.add(box(1.1,.8,1.1,M.white,0,.4));return finish(g,'Produktpodest')}if(t==='mirror'){g.add(box(1.1,2.2,.08,M.metal,0,1.15));g.add(box(.94,2,.03,M.glass,0,1.15,.06));return finish(g,'Spiegel')}if(t==='screen'){g.add(box(1.8,2.4,.12,M.dark,0,1.2));g.add(box(1.6,2.15,.04,M.screen,0,1.2,.09));return finish(g,'Digital Screen')}if(t==='billboard'){g.add(box(3.1,1.75,.12,M.dark,0,1.55));let a=new THREE.MeshStandardMaterial({color:0x8227ff,emissive:0x351070,emissiveIntensity:1});g.add(box(2.85,1.5,.04,a,0,1.55,.09));[-1.2,1.2].forEach(x=>g.add(box(.1,1.5,.1,M.metal,x,.75)));return finish(g,'OOH Marketingfläche')}if(t==='sale'){let r=new THREE.MeshStandardMaterial({color:0xd82838,emissive:0x5a050d,emissiveIntensity:.7});g.add(box(.8,1.65,.2,r,0,.83));return finish(g,'SALE Stele')}let neon=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x33bfff,emissiveIntensity:2});g.add(box(2.2,.55,.1,neon,0,1.8));return finish(g,'Leuchtlogo')}function resize(){let r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function pointer(e){let r=renderer.domElement.getBoundingClientRect();pt.x=(e.clientX-r.left)/r.width*2-1;pt.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pt,camera)}function root(o){while(o&&o.parent!==scene)o=o.parent;return objs.includes(o)?o:null}renderer.domElement.addEventListener('pointerdown',e=>{pointer(e);let h=ray.intersectObjects(objs,true)[0];if(h){sel=root(h.object);drag=true;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!sel)return;pointer(e);let v=new THREE.Vector3();if(ray.ray.intersectPlane(plane,v)){sel.position.x=Math.max(-4,Math.min(4,v.x));sel.position.z=Math.max(-4.5,Math.min(2,v.z))}});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>build(b.dataset.add));const names={light:'Mode · Heller Store',dark:'Mode · Dunkler Store',concrete:'Mode · Industrial Store',premium:'Mode · Premium Boutique'};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=b.dataset.room;room.className='room '+r;document.querySelector('#roomName').textContent=names[r];document.querySelectorAll('[data-room]').forEach(x=>x.classList.toggle('active',x.dataset.room===r))});left.onclick=()=>sel&&(sel.rotation.y-=.18);right.onclick=()=>sel&&(sel.rotation.y+=.18);bigger.onclick=()=>sel&&sel.scale.multiplyScalar(1.1);smaller.onclick=()=>sel&&sel.scale.multiplyScalar(.9);del.onclick=()=>{if(sel){scene.remove(sel);objs.splice(objs.indexOf(sel),1);sel=null}};copy.onclick=()=>{if(sel){let c=sel.clone();c.position.x+=.5;objs.push(c);scene.add(c);sel=c}};save.onclick=()=>{localStorage.setItem('deinbasar_mode_store',JSON.stringify({room:room.className,objects:objs.map(o=>({name:o.name,x:o.position.x,z:o.position.z,r:o.rotation.y,s:o.scale.x}))}));save.textContent='✓ Gespeichert';setTimeout(()=>save.textContent='Store speichern',1400)};function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}resize();build('rack');build('table');build('screen');loop();</script></body></html>
