<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Fashion Store Builder</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1218;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.top{height:64px;background:#171d24;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #ffffff17}.logo{font-size:22px;font-weight:950;min-width:210px}.logo small{display:block;font-size:8px;letter-spacing:1.8px;color:#249eff}.topbtn,.select{border:1px solid #ffffff1d;background:#202832;border-radius:10px;padding:10px 13px}.blue{background:#078cff;border-color:#078cff;font-weight:900}.spacer{flex:1}.shell{display:grid;grid-template-columns:240px minmax(0,1fr) 245px;height:calc(100vh - 64px)}.side{background:#121922;border-right:1px solid #ffffff16;padding:12px;overflow:auto}.right{border-left:1px solid #ffffff16;border-right:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:12px}.tabs button{border:0;background:transparent;padding:8px 2px;font-size:10px;border-bottom:2px solid transparent}.tabs .active{border-color:#139cff;color:#65c7ff}.section{font-size:10px;color:#8b98a9;font-weight:900;letter-spacing:1px;margin:14px 0 7px}.search{width:100%;border:1px solid #ffffff18;background:#1a222c;color:#fff;border-radius:9px;padding:9px;margin-bottom:9px}.chips{display:flex;gap:5px;margin-bottom:8px}.chips button{flex:1;border:1px solid #ffffff1a;background:#1a222d;border-radius:8px;padding:7px;font-size:9px}.chips .active{border-color:#168cff;background:#12365a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.asset{border:1px solid #ffffff15;background:#1c2631;border-radius:9px;padding:5px;min-height:82px;text-align:center}.thumb{height:48px;border-radius:7px;background:linear-gradient(145deg,#bba382,#3e3832);display:grid;place-items:center;color:#101318;font-size:24px;font-weight:900;box-shadow:inset 0 0 18px #fff2}.asset span{display:block;font-size:9px;margin-top:5px}.main{position:relative;min-width:0;background:#080b0e}.stage{position:absolute;inset:0;overflow:hidden;background:#111}.photo{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=82&w=2400');background-size:cover;background-position:center;filter:saturate(.83) brightness(.73) contrast(1.03);transform:scale(1.01);transition:.25s}.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0003 0,#0000 20%,#0000 72%,#0008 100%),radial-gradient(circle at 50% 45%,transparent 30%,#0005 100%)}.brandwall{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-weight:950;font-size:30px;text-shadow:0 2px 14px #000,0 0 14px #fff5;letter-spacing:-1px}.brandwall small{display:block;text-align:center;font-size:8px;letter-spacing:2px;font-weight:700;margin-top:3px}.tip{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:7;background:#141b22e8;border:1px solid #ffffff35;border-radius:99px;padding:8px 15px;font-size:10px;backdrop-filter:blur(10px)}#wrap{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.bottom{position:absolute;left:0;right:0;bottom:0;height:112px;background:#151c24ef;border-top:1px solid #ffffff1c;display:flex;gap:14px;padding:8px 12px;overflow:auto;z-index:8}.group{display:flex;gap:7px;align-items:flex-end}.groupTitle{position:absolute;margin-top:-2px;font-size:9px;color:#a8b3bf;font-weight:800}.roomcard{width:116px;height:78px;border:1px solid #ffffff1b;border-radius:8px;background-size:cover;background-position:center;position:relative;overflow:hidden;flex:none}.roomcard:after{content:attr(data-label);position:absolute;left:0;right:0;bottom:0;padding:6px;background:linear-gradient(transparent,#000c);font-size:9px;font-weight:800;text-align:left}.roomcard.active{outline:2px solid #168cff}.roomcard.light{background-image:url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=60&w=500')}.roomcard.dark{background-image:linear-gradient(#0007,#0007),url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=60&w=500')}.roomcard.industrial{background-image:linear-gradient(#61707a66,#61707a66),url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=60&w=500')}.roomcard.premium{background-image:linear-gradient(#8b58282e,#8b58282e),url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=60&w=500')}.marketing{width:105px;height:78px;border:1px solid #ffffff1b;border-radius:8px;background:#222b35;display:grid;place-items:center;font-size:22px;flex:none;position:relative}.marketing span{position:absolute;bottom:5px;font-size:8px}.prop{background:#1b242e;border:1px solid #ffffff18;border-radius:10px;padding:10px;margin-bottom:9px}.prop b{font-size:11px}.prop small{display:block;color:#8d9aaa;font-size:9px;margin-top:3px}.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.xyz div{background:#10171f;border:1px solid #ffffff18;border-radius:7px;padding:7px;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{border:1px solid #ffffff18;background:#1a232d;border-radius:8px;padding:9px;font-size:10px}.mobile{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side,.right{display:none}.top{height:56px}.logo{min-width:0;font-size:18px}.top .select,.top .hideMobile{display:none}.shell{height:calc(100vh - 56px)}.bottom{height:96px}.roomcard{width:100px;height:65px}.tip{top:9px;font-size:9px}.brandwall{font-size:22px}.mobile{display:flex;position:absolute;z-index:9;left:8px;right:8px;top:48px;overflow:auto;gap:5px}.mobile button{flex:none;border:1px solid #ffffff1d;background:#161e27df;border-radius:9px;padding:8px 10px;font-size:9px}}</style></head><body><header class="top"><div class="logo">🛍 DeinBasar<small>CREATE · SELL · BEYOND</small></div><button class="select">Mode Store⌄</button><button class="select">Heller Store⌄</button><div class="spacer"></div><button class="topbtn hideMobile">↶</button><button class="topbtn hideMobile">↷</button><button class="topbtn hideMobile">▶ Vorschau</button><button class="topbtn hideMobile" id="saveTop">Speichern</button><button class="topbtn blue">Veröffentlichen</button></header><div class="shell"><aside class="side"><div class="tabs"><button class="active">Objekte</button><button>Meine Artikel</button><button>Räume</button></div><div class="section">MODE-OBJEKTE</div><input class="search" placeholder="Objekte suchen ..."><div class="chips"><button class="active">Tische</button><button>Regale</button><button>Ständer</button></div><div class="grid"><button class="asset" data-add="table"><div class="thumb">▱</div><span>Verkaufstisch</span></button><button class="asset" data-add="shelf"><div class="thumb">▤</div><span>Wandregal</span></button><button class="asset" data-add="rack"><div class="thumb">♜</div><span>Kleiderständer</span></button><button class="asset" data-add="case"><div class="thumb">▣</div><span>Glasvitrine</span></button><button class="asset" data-add="pedestal"><div class="thumb">▰</div><span>Podest</span></button><button class="asset" data-add="mirror"><div class="thumb">▯</div><span>Spiegel</span></button><button class="asset" data-add="bench"><div class="thumb">▂</div><span>Sitzbank</span></button><button class="asset" data-add="plant"><div class="thumb">♣</div><span>Pflanze</span></button><button class="asset" data-add="screen"><div class="thumb">▶</div><span>Screen</span></button></div><div class="section">MARKETING</div><div class="grid"><button class="asset" data-add="billboard"><div class="thumb">NEW</div><span>Poster Wand</span></button><button class="asset" data-add="screen"><div class="thumb">▥</div><span>Digital Screen</span></button><button class="asset" data-add="logo"><div class="thumb">✦</div><span>Neon Logo</span></button></div></aside><main class="main"><section class="stage" id="stage"><div class="photo" id="photo"></div><div class="brandwall">DeinBasar<small>FASHION · PEOPLE · STORIES</small></div><div id="wrap"></div><div class="tip">Ziehe Objekte in den Raum und gestalte deinen Store</div><div class="mobile"><button data-add="table">+ Tisch</button><button data-add="rack">+ Ständer</button><button data-add="shelf">+ Regal</button><button data-add="case">+ Vitrine</button><button data-add="screen">+ Screen</button></div><div class="bottom"><div class="group"><button class="roomcard light active" data-room="light" data-label="Heller Store"></button><button class="roomcard dark" data-room="dark" data-label="Dunkler Store"></button><button class="roomcard industrial" data-room="industrial" data-label="Industrial"></button><button class="roomcard premium" data-room="premium" data-label="Premium Boutique"></button></div><div class="group"><button class="marketing" data-add="billboard">▣<span>Poster Wand</span></button><button class="marketing" data-add="screen">▶<span>Digital Screen</span></button><button class="marketing" data-add="logo">✦<span>Neon Logo</span></button></div></div></section></main><aside class="side right"><div class="section">AUSGEWÄHLTES OBJEKT</div><div class="prop"><b id="objName">Verkaufstisch Modern</b><small>3D Objekt</small><div class="xyz"><div>X <span id="px">0</span></div><div>Y 0</div><div>Z <span id="pz">0</span></div></div></div><div class="section">POSITION / ROTATION</div><div class="actions"><button id="left">↶ Drehen</button><button id="right">↷ Drehen</button><button id="bigger">+ Größer</button><button id="smaller">− Kleiner</button><button id="copy">Duplizieren</button><button id="del">Löschen</button></div><div class="section">MATERIAL & FARBE</div><div class="prop"><b>Premium Material</b><small>Holz · Metall · Glas · Stoff</small></div></aside></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap'),photo=document.querySelector('#photo');const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;wrap.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,3.1,8);camera.lookAt(0,1,-1.4);scene.add(new THREE.HemisphereLight(0xfff0dc,0x252a30,2.3));const key=new THREE.DirectionalLight(0xffdfb7,3.2);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.28}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const M={dark:new THREE.MeshStandardMaterial({color:0x17191d,metalness:.62,roughness:.3}),metal:new THREE.MeshStandardMaterial({color:0x747b82,metalness:.85,roughness:.18}),wood:new THREE.MeshStandardMaterial({color:0x76533b,roughness:.48}),white:new THREE.MeshStandardMaterial({color:0xe7ded1,roughness:.5}),glass:new THREE.MeshPhysicalMaterial({color:0xd4efff,transparent:true,opacity:.24,transmission:.6,roughness:.08}),blue:new THREE.MeshStandardMaterial({color:0x118bff,emissive:0x0a4a88,emissiveIntensity:1.2})};const objs=[];let sel=null,drag=false;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);function box(w,h,d,m,x=0,y=0,z=0){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;return q}function finish(g,n){g.name=n;g.position.set((Math.random()-.5)*2,0,-.6-Math.random()*1.8);objs.push(g);scene.add(g);sel=g;panel();return g}function build(t){let g=new THREE.Group();if(t==='rack'){g.add(box(2.1,.08,.5,M.dark,0,.07));[-.9,.9].forEach(x=>g.add(box(.07,1.8,.07,M.metal,x,.9)));g.add(box(1.9,.07,.07,M.metal,0,1.78));for(let i=0;i<7;i++)g.add(box(.2,.68,.09,new THREE.MeshStandardMaterial({color:[0xede5d9,0x222,0xb69e7e,0x53565b,0xe8e1d7,0x2c2c2c,0xc9b99e][i]}),-.72+i*.24,1.34));return finish(g,'Kleiderständer')}if(t==='shelf'){[-1.1,1.1].forEach(x=>g.add(box(.09,2.1,.55,M.dark,x,1.05)));[.35,.9,1.45,2].forEach(y=>g.add(box(2.3,.08,.55,M.wood,0,y)));return finish(g,'Wandregal')}if(t==='table'){g.add(box(2.3,.18,1.05,M.wood,0,.95));[-.85,.85].forEach(x=>[-.35,.35].forEach(z=>g.add(box(.1,.95,.1,M.dark,x,.47,z))));return finish(g,'Verkaufstisch Modern')}if(t==='case'){g.add(box(1.8,.12,.82,M.dark,0,.08));g.add(box(1.7,1.3,.75,M.glass,0,.72));return finish(g,'Glasvitrine')}if(t==='pedestal'){g.add(box(1.1,.8,1.1,M.white,0,.4));return finish(g,'Podest')}if(t==='mirror'){g.add(box(1.15,2.2,.08,M.metal,0,1.1));g.add(box(.98,2.02,.03,M.glass,0,1.1,.05));return finish(g,'Spiegel')}if(t==='bench'){g.add(box(1.9,.38,.65,M.wood,0,.5));[-.75,.75].forEach(x=>g.add(box(.1,.5,.1,M.dark,x,.25)));return finish(g,'Sitzbank')}if(t==='plant'){g.add(box(.65,.55,.65,M.dark,0,.28));for(let i=0;i<7;i++){let l=box(.12,1,.12,new THREE.MeshStandardMaterial({color:0x355e38}),0,.85,0);l.rotation.z=(i-3)*.22;g.add(l)}return finish(g,'Pflanze')}if(t==='screen'){g.add(box(1.65,2.2,.12,M.dark,0,1.1));g.add(box(1.45,1.95,.04,M.blue,0,1.1,.08));return finish(g,'Digital Screen')}if(t==='billboard'){g.add(box(2.8,1.65,.12,M.dark,0,1.5));let m=new THREE.MeshStandardMaterial({color:0xe7dfd3,emissive:0x503020,emissiveIntensity:.25});g.add(box(2.58,1.42,.04,m,0,1.5,.08));return finish(g,'Poster Wand')}let neon=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x39bdff,emissiveIntensity:2});g.add(box(2.2,.45,.08,neon,0,1.6));return finish(g,'Neon Logo')}function panel(){if(!sel)return;objName.textContent=sel.name;px.textContent=sel.position.x.toFixed(1);pz.textContent=sel.position.z.toFixed(1)}function resize(){let r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function point(e){let r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera)}function root(o){while(o&&o.parent!==scene)o=o.parent;return objs.includes(o)?o:null}renderer.domElement.addEventListener('pointerdown',e=>{point(e);let h=ray.intersectObjects(objs,true)[0];if(h){sel=root(h.object);drag=true;panel();renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!sel)return;point(e);let v=new THREE.Vector3();if(ray.ray.intersectPlane(plane,v)){sel.position.x=Math.max(-4,Math.min(4,v.x));sel.position.z=Math.max(-4.2,Math.min(2,v.z));panel()}});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>build(b.dataset.add));document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-room]').forEach(x=>x.classList.toggle('active',x===b));let r=b.dataset.room;photo.style.filter=r==='dark'?'saturate(.7) brightness(.42) contrast(1.15)':r==='industrial'?'saturate(.45) brightness(.68) contrast(1.12)':r==='premium'?'sepia(.12) saturate(.9) brightness(.72) contrast(1.05)':'saturate(.83) brightness(.73) contrast(1.03)'});left.onclick=()=>sel&&(sel.rotation.y-=.18);right.onclick=()=>sel&&(sel.rotation.y+=.18);bigger.onclick=()=>sel&&sel.scale.multiplyScalar(1.1);smaller.onclick=()=>sel&&sel.scale.multiplyScalar(.9);copy.onclick=()=>{if(sel){let c=sel.clone();c.position.x+=.5;objs.push(c);scene.add(c);sel=c;panel()}};del.onclick=()=>{if(sel){scene.remove(sel);objs.splice(objs.indexOf(sel),1);sel=null}};saveTop.onclick=()=>{localStorage.setItem('deinbasar_store_v18',JSON.stringify(objs.map(o=>({name:o.name,x:o.position.x,z:o.position.z,r:o.rotation.y,s:o.scale.x}))));saveTop.textContent='✓ Gespeichert';setTimeout(()=>saveTop.textContent='Speichern',1300)};function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}resize();build('table');build('rack');loop();</script></body></html>
