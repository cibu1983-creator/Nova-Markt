<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>DeinBasar – Showroom Builder</title><style>*{box-sizing:border-box}html,body{margin:0;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:62px 1fr}.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #ffffff18;background:#08111be8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:#61cff9}.top .spacer{flex:1}.top a,.top button{border:1px solid #ffffff1a;background:#111c29;color:#fff;padding:9px 12px;border-radius:11px;text-decoration:none}.top .primary{background:linear-gradient(135deg,#0b8cff,#6a45ff);font-weight:800}.side{border-right:1px solid #ffffff14;background:#09121b;padding:14px;overflow:auto}.side h2{font-size:17px;margin:5px 0}.hint{font-size:12px;color:#91a0ae;line-height:1.45;margin-bottom:12px}.search{width:100%;border:1px solid #ffffff1a;background:#0d1722;color:#fff;border-radius:11px;padding:10px;margin-bottom:10px}.productlist{display:grid;gap:9px}.productCard{display:grid;grid-template-columns:58px 1fr;gap:9px;align-items:center;border:1px solid #ffffff14;background:#0d1722;border-radius:14px;padding:8px;touch-action:none}.productCard img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#fff}.productCard b{font-size:12px;display:block}.productCard small{font-size:11px;color:#91a0ae}.dragBadge{font-size:10px;color:#5bd8ff;margin-top:4px}.main{padding:10px;min-width:0}.toolbar{display:flex;gap:7px;align-items:center;overflow:auto;padding:1px 0 8px}.toolbar button{flex:none;border:1px solid #ffffff18;background:#101a26;color:#dce7f1;border-radius:10px;padding:8px 11px}.toolbar .active{border-color:#31bfff;background:#0f2b3d}.toolbar span{margin-left:auto;color:#8190a0;font-size:11px;white-space:nowrap}.stage{height:calc(100vh - 128px);min-height:610px;position:relative;overflow:hidden;border-radius:22px;border:1px solid #ffffff18;box-shadow:0 30px 70px #0009;background:#131313;touch-action:none}.scene{position:absolute;inset:0;background-position:center;background-size:cover;transition:.25s}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0003,#0002 38%,#0008)}.scene.mode{background-image:linear-gradient(#0002,#0002),url('https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1800&q=80')}.scene.tech{background-image:linear-gradient(#0001,#0001),url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1800&q=80')}.scene.jewelry{background-image:linear-gradient(#0001,#0001),url('https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=1800&q=80')}.scene.basar{background-image:linear-gradient(#0001,#0001),url('https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=1800&q=80')}.brandPlate{position:absolute;left:50%;top:7%;transform:translateX(-50%);z-index:3;padding:10px 22px;border-radius:14px;background:#090909bb;border:1px solid #ffffff28;backdrop-filter:blur(7px);font-size:clamp(22px,4vw,44px);font-weight:900;text-shadow:0 2px 18px #000}.zone{position:absolute;z-index:4;border:1px dashed #ffffff2b;border-radius:14px;transition:.18s}.zone:before{content:attr(data-label);position:absolute;left:8px;top:7px;font-size:10px;font-weight:800;color:#ffffff90;background:#0008;padding:4px 6px;border-radius:7px}.zone.over{border-color:#4fd7ff;box-shadow:inset 0 0 45px #31c9ff2b,0 0 28px #31c9ff33}.wall{left:22%;right:22%;top:18%;height:24%}.shelf{left:11%;bottom:25%;width:25%;height:23%}.case{right:9%;bottom:23%;width:27%;height:25%;background:linear-gradient(180deg,#96ddff12,#ffffff08);backdrop-filter:blur(1px)}.table{left:39%;bottom:20%;width:24%;height:18%}.floorzone{left:30%;right:30%;bottom:2%;height:18%}.placed{position:absolute;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transform-origin:center bottom;filter:drop-shadow(0 12px 10px #0009);touch-action:none}.placed img{max-width:100%;max-height:100%;object-fit:contain;display:block}.placed .tag{background:#080b0eec;border:1px solid #ffffff2b;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:800;margin-top:3px;white-space:nowrap}.placed.selected{outline:2px solid #48d1ff;border-radius:10px}.placed[data-zone="wall"]{width:15%;height:18%;transform:perspective(600px) rotateX(2deg)}.placed[data-zone="shelf"]{width:10%;height:14%;transform:perspective(600px) rotateX(-3deg) rotateY(4deg)}.placed[data-zone="case"]{width:9%;height:12%;transform:perspective(600px) rotateX(4deg)}.placed[data-zone="table"]{width:11%;height:15%;transform:perspective(600px) rotateX(-4deg)}.placed[data-zone="floor"]{width:16%;height:22%;transform:perspective(700px) rotateX(-2deg)}.editor{position:absolute;right:10px;top:10px;z-index:20;width:220px;background:#08101bea;border:1px solid #ffffff20;border-radius:14px;padding:10px;backdrop-filter:blur(12px);display:none}.editor.show{display:block}.editor b{font-size:12px}.editor p{font-size:10px;color:#94a1af;margin:3px 0 9px}.editor .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.editor button{border:1px solid #ffffff1a;background:#101b27;color:#fff;border-radius:9px;padding:8px;font-size:11px}.editor .danger{color:#ff9ba6;border-color:#ff687244}.empty{border:1px dashed #ffffff24;border-radius:13px;padding:14px;text-align:center;color:#8f9dab;font-size:12px}.foot{position:absolute;left:10px;bottom:10px;z-index:12;background:#05090fca;border:1px solid #ffffff18;border-radius:12px;padding:8px 10px;color:#d8e5f0;font-size:10px;backdrop-filter:blur(10px)}.mobileProducts{display:none}.styleMenu{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.styleMenu button{border:1px solid #ffffff18;background:#0f1823;color:#dce7f0;border-radius:9px;padding:7px 9px;font-size:11px}.styleMenu .active{border-color:#43ccff;color:#fff}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:58px auto}.top{grid-column:1}.side{display:none}.main{padding:7px}.stage{height:72vh;min-height:540px}.toolbar span{display:none}.mobileProducts{display:flex;gap:7px;overflow:auto;padding:0 0 8px}.mobileProducts .productCard{min-width:155px;grid-template-columns:46px 1fr}.mobileProducts .productCard img{width:46px;height:46px}.brandPlate{top:5%}.wall{left:16%;right:16%}.shelf{left:4%;width:29%}.case{right:4%;width:29%}.table{left:35%;width:30%}.floorzone{left:26%;right:26%}.placed[data-zone="wall"]{width:22%}.placed[data-zone="shelf"],.placed[data-zone="case"],.placed[data-zone="table"]{width:15%}.placed[data-zone="floor"]{width:22%}.editor{width:190px}.foot{max-width:70%}}</style></head><body><div class="app"><header class="top"><div class="brand">DeinBasar<small>SHOWROOM BUILDER</small></div><div class="spacer"></div><a href="mein-stand.html">Mein Stand</a><button id="saveBtn">Speichern</button><button class="primary">Vorschau</button></header><aside class="side"><h2>Meine Artikel</h2><div class="hint">Zieh einen Artikel direkt in den Laden. DeinBasar passt Größe, Perspektive und Darstellung an die Fläche an.</div><input id="search" class="search" placeholder="Artikel suchen …"><div class="styleMenu"><button data-scene="mode" class="active">Mode</button><button data-scene="tech">Tech</button><button data-scene="jewelry">Schmuck</button><button data-scene="basar">Basar</button></div><div id="products" class="productlist"></div></aside><main class="main"><div class="mobileProducts" id="mobileProducts"></div><div class="toolbar"><button class="active">Showroom</button><button id="clearBtn">Alles leeren</button><button id="brandBtn">Marke ändern</button><span>Artikel ziehen → Fläche leuchtet → loslassen</span></div><section class="stage" id="stage"><div class="scene mode" id="scene"></div><div class="brandPlate" id="brandPlate">DEIN SHOP</div><div class="zone wall" data-zone="wall" data-label="Wandfläche"></div><div class="zone shelf" data-zone="shelf" data-label="Regal"></div><div class="zone case" data-zone="case" data-label="Vitrine"></div><div class="zone table" data-zone="table" data-label="Verkaufstisch"></div><div class="zone floorzone" data-zone="floor" data-label="Boden / Podest"></div><div class="editor" id="editor"><b id="editName">Artikel</b><p id="editZone">Platzierung</p><div class="row"><button id="smaller">− kleiner</button><button id="bigger">+ größer</button><button id="rotateL">↺ drehen</button><button id="rotateR">↻ drehen</button><button id="duplicate">Duplizieren</button><button id="remove" class="danger">Löschen</button></div></div><div class="foot">Adaptive Platzierung: Wand · Regal · Vitrine · Tisch · Boden</div></section></main></div><script>const SB='https://pnyoozmgiwftnyuefsgr.supabase.co',KEY='sb_publishable_LeZfLoRAvtqTMuLHaqjxbA_1rasUioY';const demo=[{id:'d1',title:'Urban Sneaker',price:129,image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80'},{id:'d2',title:'Premium Hoodie',price:89,image:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=500&q=80'},{id:'d3',title:'Smart Watch',price:219,image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80'},{id:'d4',title:'Kopfhörer',price:169,image:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80'},{id:'d5',title:'Designer Tasche',price:249,image:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=500&q=80'}];let products=[...demo],selected=null,placed=[];const stage=document.getElementById('stage'),plist=document.getElementById('products'),mplist=document.getElementById('mobileProducts'),editor=document.getElementById('editor');function money(v){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0)}function card(p){const el=document.createElement('div');el.className='productCard';el.draggable=true;el.dataset.id=p.id;el.innerHTML='<img src="'+p.image+'"><div><b>'+escapeHtml(p.title)+'</b><small>'+money(p.price)+'</small><div class="dragBadge">↗ in den Showroom ziehen</div></div>';el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',p.id)});el.addEventListener('touchstart',()=>{window.touchProduct=p},{passive:true});el.addEventListener('click',()=>placeProduct(p,'table'));return el}function renderProducts(){const q=(document.getElementById('search').value||'').toLowerCase();plist.innerHTML='';mplist.innerHTML='';products.filter(p=>p.title.toLowerCase().includes(q)).forEach(p=>{plist.append(card(p));mplist.append(card(p))})}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('search').oninput=renderProducts;document.querySelectorAll('.zone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const p=products.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(p)placeProduct(p,z.dataset.zone,z)})});stage.addEventListener('touchmove',e=>{if(!window.touchProduct)return;const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY),z=el&&el.closest('.zone');document.querySelectorAll('.zone').forEach(x=>x.classList.toggle('over',x===z))},{passive:true});stage.addEventListener('touchend',e=>{if(!window.touchProduct)return;const t=e.changedTouches[0],el=document.elementFromPoint(t.clientX,t.clientY),z=el&&el.closest('.zone');if(z)placeProduct(window.touchProduct,z.dataset.zone,z);window.touchProduct=null;document.querySelectorAll('.zone').forEach(x=>x.classList.remove('over'))});function placeProduct(p,zone,zEl){zEl=zEl||document.querySelector('.zone[data-zone="'+zone+'"]');const sr=stage.getBoundingClientRect(),zr=zEl.getBoundingClientRect();const item={uid:'p'+Date.now()+Math.random().toString(16).slice(2),id:p.id,title:p.title,price:p.price,image:p.image,zone,scale:1,rot:0,x:((zr.left-sr.left)+(zr.width*.5))/sr.width*100,y:((zr.top-sr.top)+(zr.height*.58))/sr.height*100};placed.push(item);drawPlaced();selectItem(item.uid)}function drawPlaced(){stage.querySelectorAll('.placed').forEach(x=>x.remove());placed.forEach(i=>{const el=document.createElement('div');el.className='placed'+(selected===i.uid?' selected':'');el.dataset.uid=i.uid;el.dataset.zone=i.zone;el.style.left=i.x+'%';el.style.top=i.y+'%';el.style.transform+=' translate(-50%,-50%) scale('+i.scale+') rotate('+i.rot+'deg)';el.innerHTML='<img src="'+i.image+'" alt=""><div class="tag">'+escapeHtml(i.title)+'</div>';el.onclick=e=>{e.stopPropagation();selectItem(i.uid)};makeMovable(el,i);stage.appendChild(el)})}function makeMovable(el,i){let sx,sy,ox,oy;el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;sx=e.clientX;sy=e.clientY;ox=i.x;oy=i.y;el.setPointerCapture(e.pointerId);selectItem(i.uid)});el.addEventListener('pointermove',e=>{if(sx==null)return;const r=stage.getBoundingClientRect();i.x=Math.max(2,Math.min(98,ox+(e.clientX-sx)/r.width*100));i.y=Math.max(2,Math.min(98,oy+(e.clientY-sy)/r.height*100));el.style.left=i.x+'%';el.style.top=i.y+'%'});el.addEventListener('pointerup',()=>{sx=null;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const z=[...document.querySelectorAll('.zone')].find(z=>{const q=z.getBoundingClientRect();return cx>q.left&&cx<q.right&&cy>q.top&&cy<q.bottom});if(z){i.zone=z.dataset.zone}drawPlaced();selectItem(i.uid)})}function selectItem(uid){selected=uid;const i=placed.find(x=>x.uid===uid);drawPlaced();if(!i){editor.classList.remove('show');return}document.getElementById('editName').textContent=i.title;document.getElementById('editZone').textContent='Platzierung: '+({wall:'Wand',shelf:'Regal',case:'Vitrine',table:'Tisch',floor:'Boden'}[i.zone]||i.zone);editor.classList.add('show')}stage.addEventListener('click',()=>{selected=null;editor.classList.remove('show');drawPlaced()});function edit(fn){const i=placed.find(x=>x.uid===selected);if(!i)return;fn(i);drawPlaced();selectItem(i.uid)}document.getElementById('smaller').onclick=e=>{e.stopPropagation();edit(i=>i.scale=Math.max(.55,i.scale-.12))};document.getElementById('bigger').onclick=e=>{e.stopPropagation();edit(i=>i.scale=Math.min(2,i.scale+.12))};document.getElementById('rotateL').onclick=e=>{e.stopPropagation();edit(i=>i.rot-=8)};document.getElementById('rotateR').onclick=e=>{e.stopPropagation();edit(i=>i.rot+=8)};document.getElementById('duplicate').onclick=e=>{e.stopPropagation();const i=placed.find(x=>x.uid===selected);if(!i)return;placed.push({...i,uid:'p'+Date.now(),x:i.x+4,y:i.y+2});drawPlaced()};document.getElementById('remove').onclick=e=>{e.stopPropagation();placed=placed.filter(x=>x.uid!==selected);selected=null;editor.classList.remove('show');drawPlaced()};document.getElementById('clearBtn').onclick=()=>{if(confirm('Showroom wirklich leeren?')){placed=[];drawPlaced()}};document.getElementById('brandBtn').onclick=()=>{const n=prompt('Name über deinem Laden:',document.getElementById('brandPlate').textContent);if(n)document.getElementById('brandPlate').textContent=n};document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('scene').className='scene '+b.dataset.scene});document.getElementById('saveBtn').onclick=()=>{localStorage.setItem('deinbasar_showroom_layout',JSON.stringify({placed,brand:document.getElementById('brandPlate').textContent,scene:document.querySelector('[data-scene].active')?.dataset.scene||'mode'}));alert('Showroom auf diesem Gerät gespeichert.')};function restore(){try{const d=JSON.parse(localStorage.getItem('deinbasar_showroom_layout')||'null');if(!d)return;placed=d.placed||[];document.getElementById('brandPlate').textContent=d.brand||'DEIN SHOP';if(d.scene){document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x.dataset.scene===d.scene));document.getElementById('scene').className='scene '+d.scene}drawPlaced()}catch{}}async function loadReal(){const tok=localStorage.getItem('nova_token');if(!tok)return renderProducts();try{const u=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+tok}});if(!u.ok)throw 0;const user=await u.json();const r=await fetch(SB+'/rest/v1/listings?seller_id=eq.'+user.id+'&status=eq.active&select=id,title,price,image_urls&order=created_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+tok}});if(!r.ok)throw 0;const rows=await r.json();if(rows.length){products=rows.map(x=>({id:x.id,title:x.title,price:x.price,image:(x.image_urls&&x.image_urls[0])||demo[0].image}))}renderProducts()}catch{renderProducts()}}loadReal();restore();</script></body></html>
