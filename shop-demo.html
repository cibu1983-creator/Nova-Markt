<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Mode Store Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.top{height:60px;display:flex;align-items:center;padding:0 14px;gap:10px;background:#0a0d13;border-bottom:1px solid #ffffff18}.brand{font-weight:950;font-size:20px}.brand small{display:block;color:#68cfff;font-size:9px;letter-spacing:1.4px}.spacer{flex:1}.save{border:0;border-radius:11px;background:#1677ff;padding:10px 13px;font-weight:900}.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 60px)}aside{padding:14px;background:#0c1017;border-right:1px solid #ffffff18;overflow:auto}.sect{font-size:10px;color:#77869a;font-weight:900;letter-spacing:1.2px;margin:14px 0 7px}.rooms,.assets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{border:1px solid #ffffff18;background:#131923;border-radius:12px;padding:9px;text-align:left}.card.active{border-color:#4ac8ff;background:#11273b}.card b{font-size:12px;display:block}.card small{font-size:9px;color:#8290a3}.asset{min-height:70px}.asset .ico{font-size:23px;margin-bottom:5px}.main{padding:9px;min-width:0}.bar{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.bar button{flex:none;border:1px solid #ffffff18;background:#111722;border-radius:10px;padding:8px 10px}.stage{height:calc(100vh - 122px);min-height:580px;position:relative;overflow:hidden;border:1px solid #ffffff1c;border-radius:18px;background:#0d0f13}.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 22%,#ffffff16,transparent 36%),linear-gradient(180deg,#0000 65%,#0008);z-index:1}#wrap{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}.badge{position:absolute;left:12px;top:12px;padding:9px 11px;border-radius:11px;background:#080b11cc;border:1px solid #ffffff20;z-index:3}.badge b{display:block;font-size:12px}.badge small{color:#91a0b2;font-size:9px}.help{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);background:#080b11d9;border:1px solid #ffffff20;border-radius:99px;padding:8px 11px;font-size:10px;white-space:nowrap;z-index:3}.mobileLib{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:none}.main{padding:7px}.stage{height:73vh;min-height:500px}.mobileLib{display:flex;gap:6px;overflow:auto;padding-bottom:7px}.mobileLib button{flex:none;border:1px solid #ffffff1b;background:#121822;border-radius:10px;padding:8px 10px}.top{height:56px}.brand{font-size:18px}}</style></head><body><header class="top"><div class="brand">DeinBasar<small>MODE STORE BUILDER</small></div><div class="spacer"></div><button class="save" id="save">Store speichern</button></header><div class="app"><aside><div class="sect">RAUM AUSWÄHLEN</div><div class="rooms"><button class="card active" data-room="light"><b>Heller Store</b><small>Clean · Fashion</small></button><button class="card" data-room="dark"><b>Dunkler Store</b><small>Urban · Night</small></button><button class="card" data-room="concrete"><b>Industrial</b><small>Beton · Street</small></button><button class="card" data-room="premium"><b>Premium</b><small>Warm · Boutique</small></button></div><div class="sect">MODE · EINRICHTUNG</div><div class="assets"><button class="card asset" data-add="shelf"><span class="ico">▤</span><b>Regal</b><small>Produkte / Schuhe</small></button><button class="card asset" data-add="rack"><span class="ico">♧</span><b>Kleiderständer</b><small>Fashion Rail</small></button><button class="card asset" data-add="table"><span class="ico">▱</span><b>Verkaufstisch</b><small>Kollektion</small></button><button class="card asset" data-add="case"><span class="ico">▣</span><b>Vitrine</b><small>Premium Artikel</small></button><button class="card asset" data-add="pedestal"><span class="ico">▰</span><b>Podest</b><small>Hero Product</small></button><button class="card asset" data-add="mirror"><span class="ico">▯</span><b>Spiegel</b><small>Wandobjekt</small></button></div><div class="sect">MARKETING · RETAIL MEDIA</div><div class="assets"><button class="card asset" data-add="screen"><span class="ico">▣</span><b>Digital Screen</b><small>Video / Kampagne</small></button><button class="card asset" data-add="billboard"><span class="ico">▭</span><b>OOH Fläche</b><small>Brand Campaign</small></button><button class="card asset" data-add="sale"><span class="ico">%</span><b>SALE Stele</b><small>Promotion</small></button><button class="card asset" data-add="logo"><span class="ico">✦</span><b>Leuchtlogo</b><small>Branding</small></button></div></aside><main class="main"><div class="mobileLib"><button data-room="light">☀ Hell</button><button data-room="dark">● Dunkel</button><button data-room="concrete">▧ Industrial</button><button data-room="premium">◆ Premium</button><button data-add="shelf">+ Regal</button><button data-add="rack">+ Ständer</button><button data-add="table">+ Tisch</button><button data-add="case">+ Vitrine</button><button data-add="screen">+ Screen</button><button data-add="billboard">+ OOH</button></div><div class="bar"><button id="left">↶ Drehen</button><button id="right">↷ Drehen</button><button id="smaller">− Kleiner</button><button id="bigger">+ Größer</button><button id="copy">Duplizieren</button><button id="del">Löschen</button></div><section class="stage" id="stage"><div class="ambient"></div><div id="wrap"></div><div class="badge"><b id="roomName">Mode · Heller Store</b><small>Echter 3D Laden + Einrichtung + Marketing</small></div><div class="help">Objekt antippen & ziehen · Tiefe verändert Perspektive automatisch</div></section></main></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap');const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;wrap.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,1,.1,100);camera.position.set(0,3.05,8.4);camera.lookAt(0,1.25,-2);const roomGroup=new THREE.Group();scene.add(roomGroup);const hemi=new THREE.HemisphereLight(0xffffff,0x3b4048,2);scene.add(hemi);const key=new THREE.DirectionalLight(0xfff4df,2.7);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0xa8d7ff,1.1);fill.position.set(4,4,2);scene.add(fill);const objs=[];let sel=null,drag=false,currentRoom='light';const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const M={dark:new THREE.MeshStandardMaterial({color:0x171a20,metalness:.55,roughness:.38}),metal:new THREE.MeshStandardMaterial({color:0x747b84,metalness:.8,roughness:.25}),wood:new THREE.MeshStandardMaterial({color:0x79543b,roughness:.55}),white:new THREE.MeshStandardMaterial({color:0xe9e6df,roughness:.5}),glass:new THREE.MeshPhysicalMaterial({color:0xbdeaff,transparent:true,opacity:.24,transmission:.55,roughness:.08}),screen:new THREE.MeshStandardMaterial({color:0x102846,emissive:0x168cff,emissiveIntensity:1.1})};function mat(c,r=.6,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function box(w,h,d,m,x=0,y=0,z=0){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;return q}function clearRoom(){while(roomGroup.children.length)roomGroup.remove(roomGroup.children[0])}function makePoster(x,textColor=0xffffff,bg=0x252525){const g=new THREE.Group();g.add(box(1.35,2.05,.08,mat(0x171717,.5),x,1.65,-5.72));g.add(box(1.2,1.88,.035,new THREE.MeshStandardMaterial({color:bg,emissive:bg,emissiveIntensity:.16}),x,1.65,-5.66));const stripe=box(.78,.1,.04,mat(textColor,.3),x,1.42,-5.61);g.add(stripe);roomGroup.add(g)}function buildRoom(type){currentRoom=type;clearRoom();let wall,floor,ceiling,accent,wood;if(type==='light'){wall=mat(0xf1eee8,.72);floor=mat(0xc8c2b7,.48);ceiling=mat(0xf7f5f0,.8);accent=mat(0xd4c5ae,.65);wood=mat(0xb28b65,.55)}else if(type==='dark'){wall=mat(0x202329,.7);floor=mat(0x111318,.42);ceiling=mat(0x15171c,.8);accent=mat(0x434a54,.52);wood=mat(0x4d3528,.5)}else if(type==='concrete'){wall=mat(0x858783,.95);floor=mat(0x626461,.82);ceiling=mat(0x6e706e,.9);accent=mat(0x34393d,.55);wood=mat(0x6c4932,.65)}else{wall=mat(0xe8dfd0,.7);floor=mat(0x9d8567,.48);ceiling=mat(0xf2ece2,.8);accent=mat(0xb79561,.35,.18);wood=mat(0x8c6747,.5)}roomGroup.add(box(12,.25,12,floor,0,-.14,-1));roomGroup.add(box(12,4.7,.25,wall,0,2.2,-5.9));roomGroup.add(box(.25,4.7,10,wall,-5.9,2.2,-1));roomGroup.add(box(.25,4.7,10,wall,5.9,2.2,-1));roomGroup.add(box(12,.18,10,ceiling,0,4.55,-1));roomGroup.add(box(4.6,3.45,.18,accent,-3.45,1.72,-5.73));roomGroup.add(box(4.6,3.45,.18,accent,3.45,1.72,-5.73));roomGroup.add(box(2.1,.18,.5,wood,0,2.75,-5.65));roomGroup.add(box(2.6,.18,.5,wood,0,.45,-5.65));[-4.2,-2.1,0,2.1,4.2].forEach(x=>{let l=box(1.15,.045,.45,mat(type==='dark'?0xe7f5ff:0xffffff,.2),x,4.4,-1.1);l.material.emissive=new THREE.Color(type==='dark'?0x8fcfff:0xfff5df);l.material.emissiveIntensity=2;roomGroup.add(l)});[-4.7,4.7].forEach(x=>{const niche=box(1.45,2.6,.32,mat(type==='dark'?0x12151a:0xf6f3ed,.8),x,1.6,-5.52);roomGroup.add(niche);const shelf=box(1.15,.08,.5,wood,x,.82,-5.31);roomGroup.add(shelf);const plinth=box(.85,.75,.6,accent,x,.38,-5.15);roomGroup.add(plinth)});makePoster(-2.2,0xffffff,type==='dark'?0x5b1f46:0xb97b6b);makePoster(2.2,0xffffff,type==='dark'?0x21466d:0x526b51);const bench=box(2.4,.45,.85,wood,0,.3,1.5);roomGroup.add(bench);[-1.05,1.05].forEach(x=>roomGroup.add(box(.15,.35,.7,M.dark,x,.15,1.5)));for(let z=-4.5;z<2.5;z+=1.1){let line=box(10.4,.018,.015,mat(type==='dark'?0x343b44:0xffffff,.3),0,.015,z);roomGroup.add(line)}if(type==='dark'){const neon=box(3.4,.08,.12,new THREE.MeshStandardMaterial({color:0x79d7ff,emissive:0x168cff,emissiveIntensity:2.2}),0,3.65,-5.55);roomGroup.add(neon)}if(type==='premium'){[-3.9,3.9].forEach(x=>{const frame=box(1.7,3,.1,accent,x,2,-5.48);roomGroup.add(frame)})}}function finish(g,n){g.name=n;g.userData.root=1;g.position.set((Math.random()-.5)*2,0,-.3-Math.random()*2);objs.push(g);scene.add(g);sel=g;return g}function build(t){let g=new THREE.Group();if(t==='shelf'){g.add(box(2.5,.1,.6,M.dark,0,.1));[-1.18,1.18].forEach(x=>g.add(box(.1,2.2,.55,M.metal,x,1.1)));[.55,1.1,1.65,2.15].forEach(y=>g.add(box(2.4,.07,.55,M.metal,0,y)));return finish(g,'Regal')}if(t==='rack'){g.add(box(2.1,.1,.5,M.dark,0,.08));[-.9,.9].forEach(x=>g.add(box(.08,1.8,.08,M.metal,x,.9)));g.add(box(1.9,.08,.08,M.metal,0,1.78));for(let i=0;i<6;i++)g.add(box(.22,.65,.1,new THREE.MeshStandardMaterial({color:[0x111111,0xd8c9ac,0x87404c,0x496075,0xe7e4dd,0x48634c][i]}),-.65+i*.26,1.35));return finish(g,'Kleiderständer')}if(t==='table'){g.add(box(2.2,.16,1,M.wood,0,1));[-.85,.85].forEach(x=>[-.35,.35].forEach(z=>g.add(box(.1,1,.1,M.dark,x,.5,z))));return finish(g,'Verkaufstisch')}if(t==='case'){g.add(box(2,.12,.8,M.dark,0,.08));g.add(box(1.9,1.35,.7,M.glass,0,.82));g.add(box(2,.1,.8,M.dark,0,1.5));return finish(g,'Glasvitrine')}if(t==='pedestal'){g.add(box(1.1,.8,1.1,M.white,0,.4));return finish(g,'Produktpodest')}if(t==='mirror'){g.add(box(1.1,2.2,.08,M.metal,0,1.15));g.add(box(.94,2,.03,M.glass,0,1.15,.06));return finish(g,'Spiegel')}if(t==='screen'){g.add(box(1.8,2.4,.12,M.dark,0,1.2));g.add(box(1.6,2.15,.04,M.screen,0,1.2,.09));return finish(g,'Digital Screen')}if(t==='billboard'){g.add(box(3.1,1.75,.12,M.dark,0,1.55));let a=new THREE.MeshStandardMaterial({color:0x8227ff,emissive:0x351070,emissiveIntensity:1});g.add(box(2.85,1.5,.04,a,0,1.55,.09));[-1.2,1.2].forEach(x=>g.add(box(.1,1.5,.1,M.metal,x,.75)));return finish(g,'OOH Marketingfläche')}if(t==='sale'){let r=new THREE.MeshStandardMaterial({color:0xd82838,emissive:0x5a050d,emissiveIntensity:.7});g.add(box(.8,1.65,.2,r,0,.83));return finish(g,'SALE Stele')}let neon=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x33bfff,emissiveIntensity:2});g.add(box(2.2,.55,.1,neon,0,1.8));return finish(g,'Leuchtlogo')}function resize(){let r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function pointer(e){let r=renderer.domElement.getBoundingClientRect();pt.x=(e.clientX-r.left)/r.width*2-1;pt.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pt,camera)}function root(o){while(o&&o.parent!==scene)o=o.parent;return objs.includes(o)?o:null}renderer.domElement.addEventListener('pointerdown',e=>{pointer(e);let h=ray.intersectObjects(objs,true)[0];if(h){sel=root(h.object);drag=true;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!sel)return;pointer(e);let v=new THREE.Vector3();if(ray.ray.intersectPlane(plane,v)){sel.position.x=Math.max(-4.8,Math.min(4.8,v.x));sel.position.z=Math.max(-4.8,Math.min(2.2,v.z))}});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>build(b.dataset.add));const names={light:'Mode · Heller Store',dark:'Mode · Dunkler Store',concrete:'Mode · Industrial Store',premium:'Mode · Premium Boutique'};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=b.dataset.room;buildRoom(r);document.querySelector('#roomName').textContent=names[r];document.querySelectorAll('[data-room]').forEach(x=>x.classList.toggle('active',x.dataset.room===r))});left.onclick=()=>sel&&(sel.rotation.y-=.18);right.onclick=()=>sel&&(sel.rotation.y+=.18);bigger.onclick=()=>sel&&sel.scale.multiplyScalar(1.1);smaller.onclick=()=>sel&&sel.scale.multiplyScalar(.9);del.onclick=()=>{if(sel){scene.remove(sel);objs.splice(objs.indexOf(sel),1);sel=null}};copy.onclick=()=>{if(sel){let c=sel.clone();c.position.x+=.5;objs.push(c);scene.add(c);sel=c}};save.onclick=()=>{localStorage.setItem('deinbasar_mode_store',JSON.stringify({room:currentRoom,objects:objs.map(o=>({name:o.name,x:o.position.x,z:o.position.z,r:o.rotation.y,s:o.scale.x}))}));save.textContent='✓ Gespeichert';setTimeout(()=>save.textContent='Store speichern',1400)};function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}resize();buildRoom('light');build('rack');build('table');build('screen');loop();</script></body></html>
