<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Shop Builder</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10161d;color:#eef4fa;font:14px Arial,sans-serif}button,input{font:inherit;color:inherit}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#18212a;border-bottom:1px solid #ffffff18}.logo{font-size:20px;font-weight:900}.logo small{display:block;color:#26a7ff;font-size:8px;letter-spacing:1.5px}.select,.btn{background:#222e39;border:1px solid #ffffff20;border-radius:9px;padding:10px 12px}.select{min-width:170px}.spacer{flex:1}.blue{background:#087cff;border-color:#087cff;font-weight:800}.app{display:grid;grid-template-columns:230px minmax(0,1fr) 245px;height:calc(100vh - 64px)}aside{background:#17212b;border-right:1px solid #ffffff18;overflow:auto}.right{border-left:1px solid #ffffff18;border-right:0;padding:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #ffffff15}.tabs button{background:none;border:0;padding:14px 4px;font-size:10px}.tabs .on{color:#4ab9ff;border-bottom:2px solid #168dff}.sidebody{padding:10px}.search{width:100%;padding:9px;border-radius:8px;border:1px solid #ffffff1b;background:#202c37}.chips{display:flex;gap:5px;margin:8px 0;overflow:auto}.chip{border:1px solid #ffffff20;background:#22303b;border-radius:8px;padding:7px 9px;font-size:9px}.chip.on{background:#086fce}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.asset{min-height:78px;border:1px solid #ffffff16;background:#202c37;border-radius:8px;padding:6px;font-size:8px;text-align:left}.thumb{height:45px;border-radius:5px;background:linear-gradient(145deg,#c9b99e,#604d3d);margin-bottom:5px;position:relative}.thumb:after{content:'';position:absolute;left:18%;right:18%;top:35%;height:22%;background:#e0d2bd;box-shadow:0 16px 0 -4px #8d735a}.main{position:relative;overflow:hidden}.room{position:absolute;inset:0 0 108px;background-position:center;background-size:cover;transition:.2s}.room:after{content:'';position:absolute;inset:0;background:linear-gradient(#0002,#0000 35%,#0000 75%,#0004);pointer-events:none}.objects{position:absolute;inset:0 0 108px}.obj{position:absolute;left:50%;top:68%;width:120px;height:72px;transform:translate(-50%,-100%);background:linear-gradient(145deg,#e5d3b8,#80664d);border-radius:4px;box-shadow:0 16px 18px #0008;touch-action:none;cursor:grab}.obj:before{content:'';position:absolute;left:8%;right:8%;top:15%;height:55%;border:2px solid #f3e4ce88}.obj.selected{outline:2px solid #29aaff;outline-offset:4px}.obj.shelf{height:130px;background:linear-gradient(90deg,#3d3027,#a28365,#3d3027)}.obj.case{height:125px;background:#bde8f433;border:5px solid #393f43;backdrop-filter:blur(1px)}.obj.poster{height:150px;width:80px;background:#161b20;border:5px solid #aaa;color:white;display:grid;place-items:center;font-weight:900;text-align:center}.hint{position:absolute;z-index:5;top:14px;left:50%;transform:translateX(-50%);background:#18212bdc;border:1px solid #ffffff66;border-radius:99px;padding:8px 15px;font-size:10px}.bottom{position:absolute;left:0;right:0;bottom:0;height:108px;background:#18212af5;border-top:1px solid #ffffff18;display:flex;gap:16px;padding:8px 12px;overflow:auto}.group{flex:none}.group b{display:block;font-size:9px;margin-bottom:6px}.cards{display:flex;gap:6px}.scene{width:105px;height:67px;border:1px solid #ffffff20;border-radius:7px;background-size:cover;background-position:center;position:relative}.scene span{position:absolute;left:5px;bottom:4px;font-size:8px;text-shadow:0 1px 3px #000}.sect{font-size:9px;color:#9aa9b8;font-weight:900;letter-spacing:1px;margin:9px 0}.panel{background:#202c37;border:1px solid #ffffff18;border-radius:9px;padding:10px;margin-bottom:9px}.panel b{display:block}.panel small{color:#9eacb9}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.field{background:#17212b;border:1px solid #ffffff15;border-radius:6px;padding:7px;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{border:1px solid #ffffff18;background:#202c37;border-radius:7px;padding:9px;font-size:9px}.mobilebar{display:none}@media(max-width:850px){.top{height:58px}.top .desktop{display:none}.select{min-width:0;padding:8px}.app{display:block;height:calc(100vh - 58px)}aside{display:none}.main{height:100%}.room,.objects{inset:0 0 98px}.bottom{height:98px}.hint{top:8px;white-space:nowrap}.mobilebar{display:flex;position:absolute;z-index:9;left:8px;right:8px;top:48px;gap:5px;overflow:auto}.mobilebar button{flex:none;background:#17212be8;border:1px solid #ffffff22;border-radius:8px;padding:8px;font-size:9px}.scene{width:90px;height:60px}}</style></head><body><header class="top"><div class="logo">🛍 DeinBasar<small>CREATE · SELL · BEYOND</small></div><button class="select">Mode Store⌄</button><button class="select desktop" id="roomLabel">Heller Store⌄</button><div class="spacer"></div><button class="btn desktop">↶</button><button class="btn desktop">↷</button><button class="btn desktop">3D</button><button class="btn desktop">▶ Vorschau</button><button class="btn desktop" id="save">⇩ Speichern</button><button class="btn blue">Veröffentlichen</button></header><div class="app"><aside><div class="tabs"><button class="on">▣<br>Objekte</button><button>▢<br>Meine Artikel</button><button>▧<br>Räume</button><button>✧<br>Dekoration</button><button>➤<br>Marketing</button><button>☼<br>Licht</button></div><div class="sidebody"><input class="search" placeholder="Objekte suchen …"><div class="chips"><button class="chip on">Tische</button><button class="chip">Regale</button><button class="chip">Ständer</button></div><div class="assets" id="assets"></div></div></aside><main class="main"><div class="room" id="room"></div><div class="objects" id="objects"></div><div class="hint">♧ Ziehe Objekte in den Raum und gestalte deinen Store</div><div class="mobilebar"><button data-add="table">+ Tisch</button><button data-add="shelf">+ Regal</button><button data-add="case">+ Vitrine</button><button data-add="poster">+ Marketing</button></div><div class="bottom"><div class="group"><b>RAUM-STILE (MODE)</b><div class="cards" id="rooms"></div></div><div class="group"><b>MARKETING-FLÄCHEN</b><div class="cards"><button class="scene" data-add="poster" style="background:linear-gradient(145deg,#76503d,#191c21)"><span>Poster Wand</span></button><button class="scene" data-add="poster" style="background:linear-gradient(145deg,#0bd,#f0f)"><span>Digital Screen</span></button></div></div></div></main><aside class="right"><div class="sect">AUSGEWÄHLTES OBJEKT</div><div class="panel"><b id="objName">Kein Objekt</b><small id="objType">Objekt auswählen</small></div><div class="sect">POSITION</div><div class="fields"><div class="field" id="px">X –</div><div class="field" id="py">Y –</div><div class="field">Z 0</div></div><div class="sect">SKALIERUNG / DREHUNG</div><div class="actions"><button id="small">− Kleiner</button><button id="big">+ Größer</button><button id="left">↶ Drehen</button><button id="right">↷ Drehen</button><button id="copy">Duplizieren</button><button id="del">Löschen</button></div></aside></div><script>const ROOM={light:{name:'Heller Store',url:'https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&w=1800&q=88'},dark:{name:'Dunkler Store',url:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1800&q=88'},industrial:{name:'Industrial',url:'https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1800&q=88'},premium:{name:'Premium Boutique',url:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1800&q=88'}};const types=[['table','Verkaufstisch'],['table','Rundtisch'],['shelf','Wandregal'],['case','Glasvitrine'],['shelf','Kleiderständer'],['table','Podest'],['poster','Spiegel'],['table','Kasse'],['poster','Poster']];const room=document.querySelector('#room'),objects=document.querySelector('#objects'),assets=document.querySelector('#assets');let sel=null,drag=null,ox=0,oy=0;function setRoom(k){room.style.backgroundImage=`url('${ROOM[k].url}')`;roomLabel.textContent=ROOM[k].name+'⌄';localStorage.setItem('db_room',k)}Object.entries(ROOM).forEach(([k,v])=>{const b=document.createElement('button');b.className='scene';b.style.backgroundImage=`url('${v.url}')`;b.innerHTML=`<span>${v.name}</span>`;b.onclick=()=>setRoom(k);rooms.appendChild(b)});types.forEach(([t,n])=>{const b=document.createElement('button');b.className='asset';b.dataset.add=t;b.innerHTML=`<div class="thumb"></div>${n}`;assets.appendChild(b)});function select(e){document.querySelectorAll('.obj').forEach(x=>x.classList.remove('selected'));sel=e;if(e)e.classList.add('selected');objName.textContent=e?e.dataset.name:'Kein Objekt';objType.textContent=e?'Shop-Baustein · frei platzierbar':'Objekt auswählen';panel()}function panel(){if(!sel){px.textContent='X –';py.textContent='Y –';return}px.textContent='X '+Math.round(parseFloat(sel.style.left));py.textContent='Y '+Math.round(parseFloat(sel.style.top))}function bind(e){e.onpointerdown=x=>{select(e);drag=e;const r=objects.getBoundingClientRect();ox=x.clientX-r.left-r.width*parseFloat(e.style.left)/100;oy=x.clientY-r.top-r.height*parseFloat(e.style.top)/100;e.setPointerCapture(x.pointerId)};e.onpointermove=x=>{if(drag!==e)return;const r=objects.getBoundingClientRect();let a=(x.clientX-r.left-ox)/r.width*100,b=(x.clientY-r.top-oy)/r.height*100;e.style.left=Math.max(5,Math.min(95,a))+'%';e.style.top=Math.max(20,Math.min(94,b))+'%';const depth=.55+(parseFloat(e.style.top)/100)*.65;e.dataset.depth=depth;e.style.transform=`translate(-50%,-100%) scale(${depth*(+e.dataset.scale||1)}) rotate(${+e.dataset.rot||0}deg)`;panel()};e.onpointerup=()=>drag=null}function add(t){const e=document.createElement('div');e.className='obj '+t;e.dataset.name=t==='table'?'Verkaufstisch':t==='shelf'?'Regal / Ständer':t==='case'?'Glasvitrine':'Marketing-Fläche';e.dataset.scale=1;e.dataset.rot=0;e.style.left=(42+Math.random()*16)+'%';e.style.top=(62+Math.random()*15)+'%';if(t==='poster')e.textContent='NEW\nDROP';objects.appendChild(e);bind(e);select(e)}document.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)});big.onclick=()=>{if(sel){sel.dataset.scale=(+sel.dataset.scale||1)*1.1;sel.dispatchEvent(new PointerEvent('pointermove'))}};small.onclick=()=>{if(sel){sel.dataset.scale=(+sel.dataset.scale||1)*.9;const d=+sel.dataset.depth||1;sel.style.transform=`translate(-50%,-100%) scale(${d*sel.dataset.scale}) rotate(${+sel.dataset.rot||0}deg)`}};left.onclick=()=>{if(sel){sel.dataset.rot=(+sel.dataset.rot||0)-3;const d=+sel.dataset.depth||1;sel.style.transform=`translate(-50%,-100%) scale(${d*(+sel.dataset.scale||1)}) rotate(${sel.dataset.rot}deg)`}};right.onclick=()=>{if(sel){sel.dataset.rot=(+sel.dataset.rot||0)+3;const d=+sel.dataset.depth||1;sel.style.transform=`translate(-50%,-100%) scale(${d*(+sel.dataset.scale||1)}) rotate(${sel.dataset.rot}deg)`}};del.onclick=()=>{if(sel){sel.remove();select(null)}};copy.onclick=()=>{if(sel){const c=sel.cloneNode(true);c.style.left=(parseFloat(sel.style.left)+5)+'%';objects.appendChild(c);bind(c);select(c)}};function saveShop(){const data={room:localStorage.getItem('db_room')||'light',objects:[...document.querySelectorAll('.obj')].map(e=>({type:[...e.classList].find(x=>['table','shelf','case','poster'].includes(x)),name:e.dataset.name,left:e.style.left,top:e.style.top,scale:e.dataset.scale,rot:e.dataset.rot}))};localStorage.setItem('deinbasar_shop_builder',JSON.stringify(data));if(window.save){save.textContent='✓ Gespeichert';setTimeout(()=>save.textContent='⇩ Speichern',1200)}}if(window.save)save.onclick=saveShop;const saved=JSON.parse(localStorage.getItem('deinbasar_shop_builder')||'null');setRoom(saved?.room||'light');(saved?.objects||[]).forEach(o=>{add(o.type);sel.style.left=o.left;sel.style.top=o.top;sel.dataset.scale=o.scale;sel.dataset.rot=o.rot});if(!saved)add('table');</script></body></html>
