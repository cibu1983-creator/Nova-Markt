<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Fashion 3D Store</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1218;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.top{height:64px;background:#151b22;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #ffffff17}.logo{font-size:22px;font-weight:950;min-width:210px}.logo small{display:block;font-size:8px;letter-spacing:1.8px;color:#249eff}.topbtn,.select{border:1px solid #ffffff1d;background:#202832;border-radius:10px;padding:10px 13px}.blue{background:#078cff;border-color:#078cff;font-weight:900}.spacer{flex:1}.shell{display:grid;grid-template-columns:240px minmax(0,1fr) 250px;height:calc(100vh - 64px)}.side{background:#121922;border-right:1px solid #ffffff16;padding:12px;overflow:auto}.right{border-left:1px solid #ffffff16;border-right:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:12px}.tabs button{border:0;background:transparent;padding:8px 2px;font-size:10px;border-bottom:2px solid transparent}.tabs .active{border-color:#139cff;color:#65c7ff}.section{font-size:10px;color:#8b98a9;font-weight:900;letter-spacing:1px;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.asset{border:1px solid #ffffff15;background:#1c2631;border-radius:10px;padding:8px;text-align:left;min-height:68px}.asset b{display:block;font-size:11px}.asset span{font-size:9px;color:#92a0b1}.asset .ico{font-size:24px;float:right}.main{position:relative;min-width:0;background:#080b0e}.stage{position:absolute;inset:0;overflow:hidden;background:#111}.photo{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1769107805412-90d9191d53e9?auto=format&fit=crop&fm=jpg&q=82&w=2400');background-size:cover;background-position:center;filter:saturate(.82) brightness(.58) contrast(1.06);transform:scale(1.01)}.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0004 0,#0000 26%,#0000 72%,#0008 100%),radial-gradient(circle at 50% 46%,transparent 25%,#0006 100%)}.brandwall{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-weight:950;font-size:30px;text-shadow:0 2px 14px #000,0 0 14px #fff5}.brandwall small{display:block;text-align:center;font-size:8px;letter-spacing:2px;font-weight:700;margin-top:3px}.tip{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:7;background:#141b22e8;border:1px solid #ffffff35;border-radius:99px;padding:8px 15px;font-size:10px;backdrop-filter:blur(10px)}#wrap{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.bottom{position:absolute;left:0;right:0;bottom:0;height:86px;background:#151c24ef;border-top:1px solid #ffffff1c;display:flex;gap:8px;padding:8px;overflow:auto;z-index:8}.bottom button{min-width:110px;border:1px solid #ffffff1c;background:#202a35;border-radius:9px;padding:8px;text-align:left;font-size:9px}.bottom button b{display:block;font-size:11px}.prop{background:#1b242e;border:1px solid #ffffff18;border-radius:10px;padding:10px;margin-bottom:9px}.prop b{font-size:11px}.prop small{display:block;color:#8d9aaa;font-size:9px;margin-top:3px}.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.xyz div{background:#10171f;border:1px solid #ffffff18;border-radius:7px;padding:7px;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{border:1px solid #ffffff18;background:#1a232d;border-radius:8px;padding:9px;font-size:10px}.mobile{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side,.right{display:none}.top{height:56px}.logo{min-width:0;font-size:18px}.top .select,.top .hideMobile{display:none}.shell{height:calc(100vh - 56px)}.bottom{height:78px}.tip{top:9px;font-size:9px}.brandwall{font-size:22px}.mobile{display:flex;position:absolute;z-index:9;left:8px;right:8px;top:48px;overflow:auto;gap:5px}.mobile button{flex:none;border:1px solid #ffffff1d;background:#161e27df;border-radius:9px;padding:8px 10px;font-size:9px}}</style></head><body><header class="top"><div class="logo">🛍 DeinBasar<small>CREATE · SELL · BEYOND</small></div><button class="select">Mode Store⌄</button><button class="select">Heller Store⌄</button><div class="spacer"></div><button class="topbtn hideMobile" id="saveTop">Speichern</button><button class="topbtn blue">Veröffentlichen</button></header><div class="shell"><aside class="side"><div class="tabs"><button class="active">Objekte</button><button>Meine Artikel</button><button>Räume</button></div><div class="section">ECHTE 3D MODE-OBJEKTE</div><div class="grid"><button class="asset" data-add="table"><span class="ico">▱</span><b>Verkaufstisch</b><span>Holz + Metall</span></button><button class="asset" data-add="rack"><span class="ico">♜</span><b>Kleiderständer</b><span>Rundrohr + Bügel</span></button><button class="asset" data-add="shelf"><span class="ico">▤</span><b>Wandregal</b><span>Holzböden</span></button><button class="asset" data-add="case"><span class="ico">▣</span><b>Glasvitrine</b><span>Glas + Rahmen</span></button><button class="asset" data-add="pedestal"><span class="ico">▰</span><b>Podest</b><span>Steinoptik</span></button><button class="asset" data-add="mirror"><span class="ico">▯</span><b>Spiegel</b><span>Rahmen + Spiegelglas</span></button><button class="asset" data-add="bench"><span class="ico">▂</span><b>Sitzbank</b><span>Polster + Holz</span></button><button class="asset" data-add="plant"><span class="ico">♣</span><b>Pflanze</b><span>Topf + Blätter</span></button><button class="asset" data-add="screen"><span class="ico">▶</span><b>Digital Screen</b><span>Leuchtfläche</span></button><button class="asset" data-add="billboard"><span class="ico">NEW</span><b>Poster Wand</b><span>Campaign Frame</span></button></div></aside><main class="main"><section class="stage" id="stage"><div class="photo"></div><div class="brandwall">DeinBasar<small>FASHION · PEOPLE · STORIES</small></div><div id="wrap"></div><div class="tip">3D-Objekt antippen und im Raum bewegen</div><div class="mobile"><button data-add="table">+ Tisch</button><button data-add="rack">+ Ständer</button><button data-add="shelf">+ Regal</button><button data-add="case">+ Vitrine</button><button data-add="plant">+ Pflanze</button></div><div class="bottom"><button data-add="table"><b>Verkaufstisch</b>Echtes 3D</button><button data-add="rack"><b>Kleiderständer</b>Rohre + Bügel</button><button data-add="case"><b>Glasvitrine</b>Transparent</button><button data-add="bench"><b>Sitzbank</b>Polster</button><button data-add="screen"><b>Digital Screen</b>Leuchtend</button></div></section></main><aside class="side right"><div class="section">AUSGEWÄHLTES OBJEKT</div><div class="prop"><b id="objName">Kein Objekt</b><small>echtes Three.js 3D-Objekt</small><div class="xyz"><div>X <span id="px">0</span></div><div>Y 0</div><div>Z <span id="pz">0</span></div></div></div><div class="section">BEARBEITEN</div><div class="actions"><button id="left">↶ Drehen</button><button id="right">↷ Drehen</button><button id="bigger">+ Größer</button><button id="smaller">− Kleiner</button><button id="copy">Duplizieren</button><button id="del">Löschen</button></div><div class="section">MATERIAL</div><div class="prop"><b>PBR Look</b><small>Metall · Holz · Glas · Stoff · Schatten</small></div></aside></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap');const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;wrap.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,3.25,8);camera.lookAt(0,1,-1.5);scene.add(new THREE.HemisphereLight(0xfff1df,0x252a30,2.1));const key=new THREE.DirectionalLight(0xffdfb7,3.8);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const fill=new THREE.DirectionalLight(0xbad8ff,1.6);fill.position.set(5,4,2);scene.add(fill);const rim=new THREE.PointLight(0xffc883,1.8,12);rim.position.set(0,4,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.35}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const MAT={black:new THREE.MeshStandardMaterial({color:0x17191c,metalness:.7,roughness:.24}),metal:new THREE.MeshStandardMaterial({color:0x8b8f93,metalness:.92,roughness:.16}),wood:new THREE.MeshStandardMaterial({color:0x8a5d3b,metalness:.05,roughness:.46}),woodDark:new THREE.MeshStandardMaterial({color:0x3c2a21,roughness:.5}),stone:new THREE.MeshStandardMaterial({color:0xb8aea1,roughness:.66}),fabric:new THREE.MeshStandardMaterial({color:0x8b735e,roughness:.92}),glass:new THREE.MeshPhysicalMaterial({color:0xdff5ff,transparent:true,opacity:.22,transmission:.82,roughness:.04,metalness:0,thickness:.25}),mirror:new THREE.MeshPhysicalMaterial({color:0xdce9ed,metalness:.9,roughness:.05}),screen:new THREE.MeshStandardMaterial({color:0x0b294b,emissive:0x168cff,emissiveIntensity:2.2,roughness:.2})};const objs=[];let sel=null,drag=false;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}function box(w,h,d,mat,x=0,y=0,z=0){return mesh(new THREE.BoxGeometry(w,h,d,4,2,4),mat,x,y,z)}function cyl(r,h,mat,x=0,y=0,z=0,rx=0,rz=0){const m=mesh(new THREE.CylinderGeometry(r,r,h,24),mat,x,y,z);m.rotation.x=rx;m.rotation.z=rz;return m}function rounded(w,h,d,mat,x=0,y=0,z=0){const s=new THREE.Shape();const r=Math.min(w,h)*.12;s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelSegments:2});g.center();return mesh(g,mat,x,y,z)}function hanger(g,x,y,z,c){const hook=new THREE.Mesh(new THREE.TorusGeometry(.07,.012,8,18,Math.PI*1.2),MAT.metal);hook.position.set(x,y+.12,z);hook.rotation.z=.4;g.add(hook);const bar1=cyl(.011,.35,MAT.metal,x-.12,y,z,0,Math.PI/3);const bar2=cyl(.011,.35,MAT.metal,x+.12,y,z,0,-Math.PI/3);g.add(bar1,bar2);const cloth=new THREE.Mesh(new THREE.BoxGeometry(.34,.58,.035),new THREE.MeshStandardMaterial({color:c,roughness:.88}));cloth.position.set(x,y-.32,z+.025);g.add(cloth)}function finish(g,n){g.name=n;g.position.set((Math.random()-.5)*1.8,0,-.7-Math.random()*1.5);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});objs.push(g);scene.add(g);sel=g;panel();return g}function build(t){const g=new THREE.Group();if(t==='table'){g.add(rounded(2.35,.18,1.05,MAT.wood,0,1,0));[-.9,.9].forEach(x=>[-.36,.36].forEach(z=>g.add(cyl(.055,.95,MAT.black,x,.48,z))));g.add(rounded(1.65,.12,.72,MAT.woodDark,0,.48,0));return finish(g,'Verkaufstisch Modern')}if(t==='rack'){[-.92,.92].forEach(x=>g.add(cyl(.035,1.8,MAT.black,x,.9,0)));const top=cyl(.038,1.9,MAT.black,0,1.78,0,0,Math.PI/2);g.add(top);[-.78,-.52,-.26,0,.26,.52,.78].forEach((x,i)=>hanger(g,x,1.64,.01,[0xeee8de,0x202124,0xc9b79d,0x5d6470,0xe6ded2,0x33363a,0xb59a7c][i]));g.add(rounded(2.08,.1,.5,MAT.black,0,.06,0));return finish(g,'Kleiderständer')}if(t==='shelf'){[-1.1,1.1].forEach(x=>g.add(cyl(.035,2.15,MAT.black,x,1.07,0)));[.38,.92,1.46,2.02].forEach(y=>g.add(rounded(2.3,.075,.58,MAT.wood,0,y,0)));for(let row=0;row<3;row++)for(let i=-2;i<=2;i++){const s=rounded(.34,.12,.32,new THREE.MeshStandardMaterial({color:[0xe5ddd2,0x222326,0xb9a58a][row],roughness:.8}),i*.42,.49+row*.54,.02);g.add(s)}return finish(g,'Wandregal')}if(t==='case'){g.add(rounded(1.9,.12,.85,MAT.black,0,.07,0));g.add(rounded(1.9,.1,.85,MAT.black,0,1.55,0));[-.86,.86].forEach(x=>[-.34,.34].forEach(z=>g.add(cyl(.025,1.45,MAT.metal,x,.8,z))));const gl=box(1.72,1.28,.68,MAT.glass,0,.81,0);g.add(gl);for(let i=-1;i<=1;i++){const p=cyl(.08,.07,new THREE.MeshStandardMaterial({color:0xd8b76c,metalness:.7,roughness:.25}),i*.42,.65,.02,Math.PI/2);g.add(p)}return finish(g,'Glasvitrine')}if(t==='pedestal'){g.add(rounded(1.05,.82,1.05,MAT.stone,0,.41,0));g.add(rounded(.78,.08,.78,MAT.mirror,0,.86,0));return finish(g,'Produktpodest')}if(t==='mirror'){const frame=rounded(1.15,2.2,.1,MAT.black,0,1.15,0);g.add(frame);g.add(rounded(.98,2.02,.025,MAT.mirror,0,1.15,.07));return finish(g,'Standspiegel')}if(t==='bench'){g.add(rounded(2.05,.42,.82,MAT.fabric,0,.58,0));g.add(rounded(1.88,.12,.72,MAT.woodDark,0,.28,0));[-.75,.75].forEach(x=>[-.28,.28].forEach(z=>g.add(cyl(.035,.28,MAT.black,x,.14,z))));return finish(g,'Sitzbank')}if(t==='plant'){const pot=new THREE.Mesh(new THREE.CylinderGeometry(.34,.25,.58,28),MAT.stone);pot.position.y=.29;g.add(pot);for(let i=0;i<11;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.1,14,8),new THREE.MeshStandardMaterial({color:i%2?0x315e38:0x477a49,roughness:.8}));leaf.scale.set(.75,2.6,.35);leaf.position.set(Math.sin(i*.9)*.27,.78+(i%3)*.12,Math.cos(i*.9)*.2);leaf.rotation.z=(i-5)*.13;g.add(leaf)}return finish(g,'Pflanze')}if(t==='screen'){g.add(rounded(1.5,2.3,.12,MAT.black,0,1.18,0));g.add(rounded(1.32,2.05,.025,MAT.screen,0,1.18,.08));return finish(g,'Digital Screen')}if(t==='billboard'){g.add(rounded(2.7,1.7,.12,MAT.black,0,1.55,0));const poster=new THREE.MeshStandardMaterial({color:0x7b235d,emissive:0x351026,emissiveIntensity:.7,roughness:.35});g.add(rounded(2.46,1.48,.025,poster,0,1.55,.08));[-1.05,1.05].forEach(x=>g.add(cyl(.035,1.4,MAT.black,x,.7,0)));return finish(g,'Poster Wand')}}function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function ptr(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera)}function root(o){while(o&&o.parent!==scene)o=o.parent;return objs.includes(o)?o:null}renderer.domElement.addEventListener('pointerdown',e=>{ptr(e);const h=ray.intersectObjects(objs,true)[0];if(h){sel=root(h.object);drag=true;renderer.domElement.setPointerCapture(e.pointerId);panel()}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!sel)return;ptr(e);const v=new THREE.Vector3();if(ray.ray.intersectPlane(plane,v)){sel.position.x=Math.max(-4,Math.min(4,v.x));sel.position.z=Math.max(-4.6,Math.min(2,v.z));panel()}});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>build(b.dataset.add));function panel(){objName.textContent=sel?sel.name:'Kein Objekt';px.textContent=sel?sel.position.x.toFixed(1):'0';pz.textContent=sel?sel.position.z.toFixed(1):'0'};left.onclick=()=>{if(sel){sel.rotation.y-=.16;panel()}};right.onclick=()=>{if(sel){sel.rotation.y+=.16;panel()}};bigger.onclick=()=>sel&&sel.scale.multiplyScalar(1.08);smaller.onclick=()=>sel&&sel.scale.multiplyScalar(.92);copy.onclick=()=>{if(sel){const c=sel.clone();c.position.x+=.45;objs.push(c);scene.add(c);sel=c;panel()}};del.onclick=()=>{if(sel){scene.remove(sel);objs.splice(objs.indexOf(sel),1);sel=null;panel()}};saveTop.onclick=()=>{saveTop.textContent='✓ Gespeichert';setTimeout(()=>saveTop.textContent='Speichern',1200)};function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}resize();build('table');build('rack');loop();</script></body></html>
