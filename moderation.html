<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeinBasar – Moderation</title><style>:root{--o:#f26f21;--t:#19191b;--m:#707078;--l:#e5e5e9;--bg:#f6f6f8;--ok:#237746;--bad:#a1322d;--warn:#9b5c00}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,input,textarea{font:inherit}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}header{background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:20}nav{height:64px;display:flex;align-items:center}.brand{font-weight:950;font-size:21px;text-decoration:none}.brand span{color:var(--o)}.back{margin-left:auto;text-decoration:none;color:var(--m);font-weight:800}.hero{padding:30px 0 14px}.hero h1{font-size:clamp(34px,6vw,50px);margin:0 0 8px;letter-spacing:-2px}.muted{color:var(--m);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:40px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:17px}.card h2{margin:0 0 10px}.list{display:grid;gap:9px}.item{border:1px solid var(--l);border-radius:14px;padding:11px}.title{font-weight:900}.meta{font-size:11px;color:var(--m);margin-top:4px;line-height:1.4}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:10px;padding:9px 11px;background:#19191b;color:#fff;font-weight:850;cursor:pointer}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.light{background:#f1f1f3;color:#19191b}.notice{padding:12px;border-radius:12px;background:#f1f1f3;color:var(--m);font-size:12px}.notice.bad{background:#fff0ee;color:var(--bad)}.notice.ok{background:#edf8f1;color:var(--ok)}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><nav class="wrap"><a class="brand" href="basar.html">dein<span>basar</span>.de</a><a class="back" href="konto.html">← Konto</a></nav></header><main class="wrap"><section class="hero"><h1>Moderation</h1><p class="muted">Interne Queue für Händlerprüfung, zurückgehaltene Anzeigen, Einsprüche und Rechtsmeldungen.</p></section><div id="gate" class="notice">Prüfe Berechtigung …</div><section id="dashboard" class="grid hidden"><div class="card"><h2>Händlerprüfung</h2><div id="shops" class="list"></div></div><div class="card"><h2>Anzeigenprüfung</h2><div id="listings" class="list"></div></div><div class="card"><h2>Einsprüche</h2><div id="appeals" class="list"></div></div><div class="card"><h2>Rechtsmeldungen</h2><div id="legal" class="list"></div></div><div class="card"><h2>Nutzermeldungen</h2><div id="reports" class="list"></div></div><div class="card"><h2>Sicherheitsereignisse</h2><div id="events" class="list"></div></div></section></main><script src="app-core.js?v=16"></script><script>const $=id=>document.getElementById(id);let me;function esc(v){return DB.esc(v??'')}function empty(t){return '<div class="notice">'+esc(t)+'</div>'}async function rpc(name,body){return DB.authRequest('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function init(){try{me=await DB.user();const ok=await rpc('is_moderator',{});if(ok!==true)throw Error('Keine Moderationsberechtigung.');$('gate').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}catch(e){$('gate').className='notice bad';$('gate').textContent=e.message||'Nicht erlaubt.'}}async function load(){await Promise.all([loadShops(),loadListings(),loadAppeals(),loadLegal(),loadReports(),loadEvents()])}async function loadShops(){const r=await DB.authRequest('/rest/v1/shops?is_commercial=eq.true&trader_verification_status=in.(pending,rejected)&select=id,name,business_name,city,contact_email,trader_verification_status,status,created_at&order=created_at.asc');$('shops').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">'+esc(x.business_name||x.name)+'</div><div class="meta">'+esc(x.city||'')+' · '+esc(x.contact_email||'')+' · '+esc(x.trader_verification_status)+'</div><div class="buttons"><button class="btn ok" onclick="shopDecision(\''+x.id+'\',\'verify\')">Freigeben</button><button class="btn bad" onclick="shopDecision(\''+x.id+'\',\'reject\')">Ablehnen</button></div></div>').join(''):empty('Keine offenen Händlerprüfungen.')}async function loadListings(){const r=await DB.authRequest('/rest/v1/listings?or=(moderation_status.eq.pending,moderation_status.eq.blocked,compliance_hold.eq.true)&select=id,title,seller_kind,moderation_status,moderation_reason,compliance_hold,risk_score,risk_flags,created_at&order=created_at.asc');$('listings').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(x.seller_kind)+' · Moderation: '+esc(x.moderation_status)+' · Compliance: '+x.compliance_hold+' · Risiko '+x.risk_score+'<br>'+esc((x.risk_flags||[]).join(', '))+'</div><div class="buttons"><a class="btn light" href="anzeige.html?id='+encodeURIComponent(x.id)+'">Öffnen</a><button class="btn ok" onclick="listingDecision(\''+x.id+'\',\'approve\')">Freigeben</button><button class="btn bad" onclick="listingDecision(\''+x.id+'\',\'block\')">Blockieren</button></div></div>').join(''):empty('Keine offenen Anzeigenprüfungen.')}async function loadAppeals(){const r=await DB.authRequest('/rest/v1/moderation_appeals?status=in.(received,reviewing)&select=id,listing_id,reason,status,created_at&order=created_at.asc');$('appeals').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">Einspruch</div><div class="meta">'+esc(x.reason)+'</div><div class="buttons"><button class="btn ok" onclick="appealDecision(\''+x.id+'\',\'reversed\')">Aufheben</button><button class="btn bad" onclick="appealDecision(\''+x.id+'\',\'upheld\')">Bestätigen</button></div></div>').join(''):empty('Keine offenen Einsprüche.')}async function loadLegal(){const r=await DB.authRequest('/rest/v1/legal_notices?status=in.(received,reviewing)&select=id,reporter_email,content_url,legal_basis,explanation,status,created_at&order=created_at.asc');$('legal').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">'+esc(x.legal_basis)+'</div><div class="meta">'+esc(x.content_url)+'<br>'+esc(x.explanation)+'</div><div class="buttons"><button class="btn ok" onclick="legalDecision(\''+x.id+'\',\'actioned\')">Maßnahme erfolgt</button><button class="btn bad" onclick="legalDecision(\''+x.id+'\',\'rejected\')">Zurückweisen</button></div></div>').join(''):empty('Keine offenen Rechtsmeldungen.')}async function loadReports(){const r=await DB.authRequest('/rest/v1/reports?status=eq.open&select=id,reason,details,listing_id,shop_id,conversation_id,created_at&order=created_at.asc');$('reports').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">'+esc(x.reason)+'</div><div class="meta">'+esc(x.details||'')+'</div></div>').join(''):empty('Keine offenen Nutzermeldungen.')}async function loadEvents(){const r=await DB.authRequest('/rest/v1/safety_events?select=id,event_type,severity,object_type,object_id,details,created_at&order=created_at.desc&limit=30');$('events').innerHTML=r.length?r.map(x=>'<div class="item"><div class="title">'+esc(x.event_type)+' · '+esc(x.severity)+'</div><div class="meta">'+esc(x.object_type||'')+' '+esc(x.object_id||'')+'<br>'+esc(JSON.stringify(x.details||{}))+'</div></div>').join(''):empty('Keine Sicherheitsereignisse.')}window.shopDecision=async(id,d)=>{const reason=prompt('Kurze Begründung / Prüfnotiz:','')??'';await rpc('moderate_shop',{p_shop_id:id,p_decision:d,p_reason:reason});await loadShops();await loadListings()};window.listingDecision=async(id,d)=>{const reason=prompt('Begründung:','')??'';await rpc('moderate_listing',{p_listing_id:id,p_decision:d,p_reason:reason});await loadListings()};window.appealDecision=async(id,d)=>{const reason=prompt('Entscheidungsbegründung:','')??'';await rpc('moderate_appeal',{p_appeal_id:id,p_decision:d,p_reason:reason});await loadAppeals();await loadListings()};window.legalDecision=async(id,d)=>{const reason=prompt('Entscheidungsbegründung:','')??'';await rpc('moderate_legal_notice',{p_notice_id:id,p_status:d,p_reason:reason});await loadLegal()};init();</script></body></html>
